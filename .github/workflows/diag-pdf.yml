name: Diag PDF fetch
on:
  push:
    branches: [claude/diag-pdf-fetch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - name: Before (live version)
        run: |
          git show origin/claude/project-task-manager-design-w2j421:mockup/asterisk.html > mockup/asterisk.html
          (MARGINALIA_STATE=/tmp/s1.json node bin/serve.mjs > /tmp/srv1.log 2>&1 &) ; sleep 2
          node .github/diag/pw.cjs; pkill -f bin/serve.mjs || true; sleep 1
      - name: After (fix branch)
        run: |
          git show origin/claude/read-linked-pdfs:mockup/asterisk.html > mockup/asterisk.html
          (MARGINALIA_STATE=/tmp/s2.json node bin/serve.mjs > /tmp/srv2.log 2>&1 &) ; sleep 2
          node .github/diag/pw.cjs; pkill -f bin/serve.mjs || true

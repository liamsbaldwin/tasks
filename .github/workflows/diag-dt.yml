name: Diag Digital Twins fetch
on:
  push:
    branches: [claude/diag-digital-twins]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch from Cloudflare's edge (remote preview, nothing deployed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd .github/diag/cfw
          (npx -y wrangler@4 dev --remote --port 8799 > /tmp/dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -m 90 localhost:8799 -o /tmp/out.json && break; sleep 2; done
          cat /tmp/out.json || true; echo; tail -5 /tmp/dev.log

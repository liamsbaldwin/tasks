<title>Marginalia Quarterly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..500&display=swap">

<style>
/* Layout: a blue menu panel at the left, and a single left-justified column of type.
   Titles and decks carry the colour; everything else is black on near-white. */
:root{
  --paper:#FAF8F0;          /* sampled from the reference */
  --ink:#000000;
  --ink-2:#2A2A28;
  --faint:#7E7B72;
  --blue:#2D90CF;
  --blue-pale:#ABD3EC;      /* the menu's current item */
  --blue-wash:rgba(45,144,207,.09);
  --rule:#E3DFD2;
  --paper-2:#F2EFE4;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --rail:248px;
  --measure:36rem;
  --gutter:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper)}
body{
  color:var(--ink); font-family:var(--text); font-size:18px; line-height:1.62;
  margin:0; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:400; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--blue); outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ the menu ============ */
.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100%}
.shell--shut{grid-template-columns:minmax(0,1fr)}
.shell--shut .menu{display:none}

.menu{
  background:var(--blue); position:sticky; top:0; align-self:start;
  height:100vh; display:flex; flex-direction:column;
  padding:26px 0 24px; overflow-y:auto;
}
.menu__x{width:40px; height:40px; margin:0 0 30px 22px; color:var(--ink); display:grid; place-items:center}
.menu__list{display:flex; flex-direction:column}
.menu__item{
  font-family:var(--display); font-size:28px; line-height:1.3; letter-spacing:-.004em;
  text-align:left; color:var(--ink); padding:3px 22px;
}
.menu__item:hover{color:#FFFFFF}
.menu__item[aria-current="true"]{color:var(--blue-pale)}
.menu__foot{
  margin-top:auto; padding:0 22px; font-size:14px; color:rgba(0,0,0,.52); line-height:1.5;
}

.burger{
  position:absolute; top:22px; left:var(--gutter); width:34px; height:34px;
  display:grid; place-items:center; color:var(--ink);
}
/* Scoped to the wide layout: at phone width the menu is an overlay and the burger is
   the only way to open it, so a blanket hide here would out-specify that. */
@media (min-width:861px){ .shell:not(.shell--shut) .burger{display:none} }

/* ============ the page ============ */
.page{position:relative; padding-left:var(--gutter); padding-right:var(--gutter-r)}
.page__in{max-width:52rem; padding-block:44px 90px}
.shell--shut .page__in{padding-top:76px}

.pagetitle{
  font-family:var(--display); color:var(--blue);
  font-size:clamp(34px, 5.4vw, 52px); line-height:1.04; letter-spacing:-.016em;
}
.pagedeck{
  font-family:var(--display); color:var(--blue); font-size:clamp(20px, 2.6vw, 25px);
  line-height:1.22; margin-top:10px; max-width:30ch;
}
.pagehead{margin-bottom:38px}
.byline{
  font-family:var(--display); font-style:italic; color:var(--blue);
  font-size:clamp(22px, 3.4vw, 32px); line-height:1.1; margin-top:2px;
}

/* ============ lists ============ */
.list{display:flex; flex-direction:column}
.row{
  display:block; width:100%; text-align:left; padding:17px 0;
  border-top:1px solid var(--rule);
}
.row:last-child{border-bottom:1px solid var(--rule)}
.row:hover .row__t{color:var(--blue)}
.row__t{
  font-family:var(--display); font-size:27px; line-height:1.16; letter-spacing:-.008em;
  display:block; transition:color .12s ease;
}
.row__d{display:block; color:var(--ink-2); font-size:16.5px; line-height:1.5; margin-top:4px; max-width:var(--measure)}
.row__m{
  display:flex; gap:12px; align-items:baseline; margin-top:8px;
  font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums;
}
.row__m b{color:var(--blue); font-weight:400}

.src__t{font-family:var(--text); font-style:italic; font-size:19px; line-height:1.35; display:block}
.src__b{display:block; color:var(--ink-2); font-size:15.5px; margin-top:2px}
.src__m{margin-top:6px}

/* ============ progress ============ */
.figures{display:flex; flex-wrap:wrap; gap:14px 54px; margin-bottom:44px}
.fig__n{
  font-family:var(--display); color:var(--blue); font-size:46px; line-height:1;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:block;
}
.fig__l{display:block; font-size:15px; color:var(--ink-2); margin-top:4px}
.bars{display:flex; flex-direction:column}
.bar{padding:15px 0; border-top:1px solid var(--rule)}
.bar:last-child{border-bottom:1px solid var(--rule)}
.bar__top{display:flex; align-items:baseline; gap:12px; justify-content:space-between}
.bar__t{font-family:var(--display); font-size:21px; line-height:1.2}
.bar__n{font-size:14px; color:var(--faint); white-space:nowrap; font-variant-numeric:tabular-nums}
.bar__track{height:3px; background:var(--paper-2); margin-top:10px}
.bar__fill{display:block; height:100%; background:var(--blue)}

/* ============ writing ============ */
.prose{font-size:18px; line-height:1.68; max-width:var(--measure); outline:none}
.prose h2{
  font-family:var(--display); font-size:24px; line-height:1.2; margin:34px 0 9px;
  letter-spacing:-.008em;
}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 1.05em}
.prose > p:last-child{margin-bottom:0}
.prose blockquote{
  margin:1.4em 0; padding-left:20px; border-left:2px solid var(--blue);
  color:var(--ink-2); font-size:17px;
}
.prose ul{margin:0 0 1.05em; padding-left:1.3em}
.prose li{margin:.18em 0}
.prose a{color:var(--blue)}
[contenteditable]:empty::before,
[contenteditable].is-empty::before{content:attr(data-ph); color:var(--faint); font-style:italic}
[contenteditable]{outline:none}
h1[contenteditable].is-empty::before, .pagedeck[contenteditable].is-empty::before{
  color:rgba(45,144,207,.42); font-style:normal;
}

.tools{
  display:flex; gap:3px; align-items:center;
  height:0; margin:0; overflow:hidden; opacity:0; pointer-events:none;
  transition:height .13s ease, margin .13s ease, opacity .13s ease;
}
.rich:focus-within .tools{height:30px; margin-bottom:10px; opacity:1; pointer-events:auto}
.tools button{
  min-width:30px; height:28px; padding:0 8px; border-radius:3px; color:var(--faint);
  font-family:var(--text); font-size:15px; line-height:1;
}
.tools button:hover{background:var(--blue-wash); color:var(--blue)}
.tools i{font-style:italic}
.tools .q{font-size:21px; position:relative; top:3px}
.saved{
  margin-left:8px; font-size:13px; color:var(--blue); opacity:0; transition:opacity .25s ease;
}
.saved.on{opacity:1}
.math{font-size:1.02em}

.foot{
  margin-top:40px; padding-top:14px; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:14px;
  font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums;
}
.back{
  font-family:var(--display); font-size:17px; color:var(--blue);
  display:inline-block; margin-bottom:26px;
}
.empty{color:var(--faint); font-style:italic}

@media (max-width:860px){
  :root{--rail:0px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu{
    display:none; position:fixed; inset:0; height:100%; z-index:30; width:min(84vw, 320px);
    padding-left:var(--gutter);
  }
  .shell--open .menu{display:flex}
  .burger{display:grid}
  .shell--open .burger{display:none}
  .page__in{padding-top:70px}
}
</style>

<div class="shell" id="shell">
  <nav class="menu" id="menu">
    <button class="menu__x" id="close" aria-label="Close the menu">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M4 4 20 20M20 4 4 20"/></svg>
    </button>
    <div class="menu__list" id="menulist"></div>
    <div class="menu__foot">Marginalia<br>idea &rarr; reading &rarr; essay</div>
  </nav>

  <div class="page">
    <button class="burger" id="open" aria-label="Open the menu">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M3 8h20M3 13h20M3 18h20"/></svg>
    </button>
    <div class="page__in" id="view"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const STAGES = {reading:"Reading", drafting:"Drafting", editing:"Editing", published:"Published"};
const KIND = {book:"Book", paper:"Paper", essay:"Essay", talk:"Talk"};

/* ---------- the notebook ---------- */
const seed = {
  ideas: [
    {id:"legibility", title:"The Cost of Legibility", stage:"drafting",
     dek:"Every system that wants to be governed first has to be made readable — and the act of making it readable quietly destroys the thing worth governing.",
     deck:"On what standardisation buys, and what it silently spends."},
    {id:"forget", title:"Why Interfaces Forget", stage:"reading",
     dek:"Software used to remember where you were. Somewhere between the desktop and the feed, interfaces stopped keeping state on your behalf.", deck:""},
    {id:"scale", title:"Scaling Laws Outside the Lab", stage:"reading",
     dek:"Metabolic scaling is beautiful in biology and suspiciously popular everywhere else. When does a power law describe a mechanism?", deck:""},
    {id:"tendays", title:"Ten Days a Week", stage:"editing",
     dek:"The French Republican calendar failed for reasons that had nothing to do with revolutionary fervour and everything to do with market days.", deck:""},
    {id:"maps", title:"The Map Became the Territory", stage:"published",
     dek:"What happens after the model is good enough that nobody checks it against the ground any more.", deck:""},
  ],
  readings: [
    {id:"r1", kind:"book", title:"Seeing Like a State", authors:["James C. Scott"], year:1998,
     venue:"Yale University Press", ideas:["legibility","maps"], status:"read",
     note:"<p>Scott's core move: states can only administer what they can see, so they simplify reality into legible grids — cadastral maps, permanent surnames, standard measures, scientific forestry. The simplification is genuinely useful, but it deletes the local, unwritten knowledge that made the original system work.</p>"},
    {id:"r3", kind:"essay", title:"The Tyranny of Structurelessness", authors:["Jo Freeman"], year:1972,
     venue:"Berkeley Journal of Sociology", ideas:["legibility"], status:"read",
     note:"<p>The inverse argument, and the one that keeps the thesis honest: refusing to make a group legible does not abolish its power structure, it makes it invisible and unaccountable.</p>"},
    {id:"r2", kind:"book", title:"The Measure of All Things", authors:["Ken Alder"], year:2002,
     venue:"The Free Press", ideas:["legibility"], status:"reading",
     note:"<p>The seven-year expedition to measure the meridian and define the metre. The control case: a standardisation project that mostly worked, and whose surveyors quietly fudged data they could not reconcile.</p>"},
    {id:"r4", kind:"book", title:"Standards: Recipes for Reality", authors:["Lawrence Busch"], year:2011,
     venue:"MIT Press", ideas:["legibility"], status:"queued", note:""},
    {id:"r5", kind:"paper", title:"Cadastral Maps and the Fiscal Grid", authors:["R. Kain","E. Baigent"], year:1992,
     venue:"The Cadastral Map in the Service of the State", ideas:["legibility"], status:"queued", note:""},
    {id:"r6", kind:"paper", title:"The Computer for the 21st Century", authors:["Mark Weiser"], year:1991,
     venue:"Scientific American 265(3)", ideas:["forget"], status:"reading",
     note:"<p>The disappearing-computer essay. Worth reading against the grain: Weiser wanted machines that faded into the background because they held context for you. What actually shipped fades into the background while holding nothing.</p>"},
    {id:"r7", kind:"essay", title:"As We May Think", authors:["Vannevar Bush"], year:1945,
     venue:"The Atlantic", ideas:["forget","legibility"], status:"queued", note:""},
    {id:"r8", kind:"paper", title:"Direct Manipulation: A Step Beyond Programming Languages",
     authors:["Ben Shneiderman"], year:1983, venue:"IEEE Computer 16(8)", ideas:["forget"], status:"queued", note:""},
    {id:"r9", kind:"paper", title:"Beyond Being There", authors:["Jim Hollan","Scott Stornetta"], year:1992,
     venue:"CHI '92", ideas:["forget"], status:"queued", note:""},
    {id:"r10", kind:"paper", title:"A General Model for the Origin of Allometric Scaling Laws in Biology",
     authors:["G. West","J. Brown","B. Enquist"], year:1997, venue:"Science 276", ideas:["scale"], status:"queued", note:""},
    {id:"r11", kind:"book", title:"Scale", authors:["Geoffrey West"], year:2017,
     venue:"Penguin Press", ideas:["scale"], status:"queued", note:""},
    {id:"r12", kind:"paper", title:"Growth, Innovation, Scaling, and the Pace of Life in Cities",
     authors:["L. Bettencourt","J. Lobo","G. West"], year:2007, venue:"PNAS 104(17)", ideas:["scale","maps"], status:"queued", note:""},
    {id:"r13", kind:"talk", title:"The Surprising Math of Cities and Corporations", authors:["Geoffrey West"], year:2011,
     venue:"TED", ideas:["scale"], status:"queued", note:""},
    {id:"r14", kind:"book", title:"Time and the French Revolution", authors:["Matthew Shaw"], year:2011,
     venue:"The Boydell Press", ideas:["tendays"], status:"read",
     note:"<p>The Republican calendar as administrative project rather than symbolic gesture. Market days, wages and religious observance all ran on the seven-day rhythm, and none of them could be re-cut by decree.</p>"},
    {id:"r15", kind:"paper", title:"The French Republican Calendar: A Case Study in the Sociology of Time",
     authors:["Eviatar Zerubavel"], year:1977, venue:"American Sociological Review 42(6)",
     ideas:["tendays","legibility"], status:"read",
     note:"<p>The week is the only major time unit with no astronomical anchor — it is purely social, which is exactly why it proved unbudgeable.</p>"},
    {id:"r16", kind:"book", title:"The Calendar in Revolutionary France", authors:["Sanja Perovic"], year:2012,
     venue:"Cambridge University Press", ideas:["tendays"], status:"reading", note:""},
  ],
  drafts: {
    legibility:`<h2>1 · The forest that was counted to death</h2>
<p>In the late eighteenth century, Prussian and Saxon foresters set out to solve a problem that sounds purely administrative: nobody knew how much timber the crown owned. What followed is the cleanest example I know of a measurement project that changed the thing it measured.</p>
<blockquote>Scientific forestry produced a forest that was easier to count and, within a century, one that was dying.</blockquote>
<p>The order of operations matters. The foresters did not set out to simplify the forest. They set out to <i>see</i> it — and seeing required a unit, and the unit required that everything which was not that unit stop mattering.</p>
<h2>2 · What legibility actually buys</h2>
<p>It would be easy, and wrong, to write this as a story about bureaucratic vandalism. Legibility is the precondition for almost everything I would not want to live without: public health statistics, land title that survives the death of the person who remembers the boundary, a currency.</p>
<p>So the question is not whether to measure. It is what the measurement is allowed to overwrite once it exists, and who gets to say.</p>`,
  },
  roadmap:`<h2>What the whole thing is for</h2>
<p>Four essays and a video apiece, on the same underlying argument: that the instruments we use to see a system are never neutral observers of it. Legibility is the clearest case; the calendar piece is the cheapest to finish; the scaling piece is the one most likely to be wrong.</p>
<h2>What ships first</h2>
<p><i>Ten Days a Week</i> — it is nearly edited and the reading is done. <i>The Cost of Legibility</i> is the better essay but still owes a section on who gets to object.</p>
<h2>Still unsure about</h2>
<p>Whether the scaling piece is an essay or a footnote in someone else's.</p>`,
};

const STORE = "marginalia.quarterly.v1";
let data = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.ideas) && Array.isArray(d.readings)) return d;
    }
  }catch{ /* private window, or nothing stored yet */ }
  return structuredClone(seed);
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      localStorage.setItem(STORE, JSON.stringify(data));
      const flag = $("#saved");
      if(!flag) return;
      flag.classList.add("on");
      clearTimeout(flag._t);
      flag._t = setTimeout(() => flag.classList.remove("on"), 1100);
    }catch{ /* carry on in memory */ }
  }, 300);
}

/* ---------- state ---------- */
let view = "contents", openSource = null, openIdea = "legibility";

const byIdea = id => data.readings.filter(r => r.ideas.includes(id));
const readN = id => byIdea(id).filter(r => r.status === "read").length;
const WORD_RE = /[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu;
function words(html){
  if(!html) return 0;
  const box = document.createElement("div");
  box.innerHTML = html;
  const f = box.querySelectorAll(".math");
  const n = f.length;
  f.forEach(x => x.remove());
  return ((box.textContent || "").match(WORD_RE) || []).length + n;
}

/* ---------- the menu ---------- */
const PAGES = [
  ["contents","Contents"], ["sources","Sources"], ["progress","Progress"],
  ["draft","The Draft"], ["roadmap","Roadmap"],
];
function renderMenu(){
  $("#menulist").innerHTML = PAGES.map(([id,label]) =>
    `<button class="menu__item" data-view="${id}" aria-current="${view===id}">${label}</button>`).join("");
}

/* ---------- views ---------- */
const head = (title, deck) => `<div class="pagehead">
  <h1 class="pagetitle">${title}</h1>${deck ? `<p class="pagedeck">${deck}</p>` : ""}</div>`;

function viewContents(){
  return head("Contents", `${data.ideas.length} ideas, ${data.readings.length} sources.`) +
  `<div class="list">${data.ideas.map(i => `
    <button class="row" data-idea="${i.id}">
      <span class="row__t">${esc(i.title)}</span>
      <span class="row__d">${esc(i.dek)}</span>
      <span class="row__m"><b>${STAGES[i.stage]}</b><span>${readN(i.id)}/${byIdea(i.id).length} read</span>
        <span>${words(data.drafts[i.id] || "").toLocaleString()} words</span></span>
    </button>`).join("")}</div>`;
}

function viewSources(){
  const read = data.readings.filter(r => r.status === "read").length;
  return head("Sources", `${read} of ${data.readings.length} read.`) +
  `<div class="list">${data.readings.map(r => `
    <button class="row" data-src="${r.id}">
      <span class="src__t">${esc(r.title)}</span>
      <span class="src__b">${r.authors.map(esc).join(" & ")} · ${esc(r.venue)}</span>
      <span class="row__m src__m"><b>${r.status === "read" ? "Read" : r.status === "reading" ? "Reading" : "Queued"}</b>
        <span>${KIND[r.kind]}</span><span>${r.year}</span></span>
    </button>`).join("")}</div>`;
}

function viewProgress(){
  const totalRead = data.readings.filter(r => r.status === "read").length;
  const totalWords = Object.values(data.drafts).reduce((n, d) => n + words(d), 0);
  const published = data.ideas.filter(i => i.stage === "published").length;
  const figs = [
    [data.ideas.length, "ideas"], [`${totalRead}/${data.readings.length}`, "sources read"],
    [totalWords.toLocaleString(), "words written"], [published, "published"],
  ];
  return head("Progress", "Where everything actually stands.") +
  `<div class="figures">${figs.map(([n,l]) =>
    `<span><span class="fig__n">${n}</span><span class="fig__l">${l}</span></span>`).join("")}</div>
  <div class="bars">${data.ideas.map(i => {
    const rs = byIdea(i.id), r = readN(i.id);
    const pct = rs.length ? Math.round(r / rs.length * 100) : 0;
    return `<div class="bar">
      <div class="bar__top"><span class="bar__t">${esc(i.title)}</span>
        <span class="bar__n">${STAGES[i.stage]} · ${r}/${rs.length} read · ${words(data.drafts[i.id] || "").toLocaleString()} w</span></div>
      <div class="bar__track"><span class="bar__fill" style="width:${pct}%"></span></div>
    </div>`;
  }).join("")}</div>`;
}

function viewSource(){
  const r = data.readings.find(x => x.id === openSource);
  return `<button class="back" data-view="sources">&larr; Sources</button>
  <div class="pagehead">
    <h1 class="pagetitle" contenteditable="true" data-edit="reading.title" data-ph="Title">${esc(r.title)}</h1>
    <p class="byline">${r.authors.map(esc).join(", ")}</p>
    <p class="pagedeck">${esc(r.venue)}, ${r.year}</p>
  </div>
  <div class="rich">${tools()}<div class="prose" contenteditable="true" data-edit="reading.note" data-rich="1"
    data-ph="What is the argument, and where does it fail?">${r.note}</div></div>
  <div class="foot"><span>${KIND[r.kind]}</span><span>${r.ideas.map(id =>
    esc(data.ideas.find(i => i.id === id)?.title || id)).join(" · ")}</span></div>`;
}

function viewDraft(){
  const i = data.ideas.find(x => x.id === openIdea) || data.ideas[0];
  openIdea = i.id;
  const w = words(data.drafts[i.id] || "");
  return `<div class="pagehead">
    <h1 class="pagetitle" contenteditable="true" data-edit="idea.title" data-ph="Name it">${esc(i.title)}</h1>
    <p class="pagedeck" contenteditable="true" data-edit="idea.deck"
       data-ph="A line to say what it is about">${esc(i.deck || "")}</p>
  </div>
  <div class="rich">${tools()}<div class="prose" contenteditable="true" data-edit="draft" data-rich="1"
    data-ph="Start anywhere. The first paragraph is always wrong.">${data.drafts[i.id] || ""}</div></div>
  <div class="foot"><span>${STAGES[i.stage]}</span>
    <span><span id="wordnow">${w.toLocaleString()}</span> words</span></div>`;
}

function viewRoadmap(){
  return `<div class="pagehead"><h1 class="pagetitle">Roadmap</h1></div>
  <div class="rich">${tools()}<div class="prose" contenteditable="true" data-edit="roadmap" data-rich="1"
    data-ph="What is the whole project for? What ships first, and what is it waiting on?">${data.roadmap}</div></div>`;
}

function tools(){
  return `<div class="tools">
    <button data-cmd="bold" title="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic"><i>I</i></button>
    <button data-cmd="insertUnorderedList" title="Bullets">•</button>
    <button data-cmd="quote" title="Quote"><span class="q">&ldquo;</span></button>
    <button data-cmd="math" title="Maths — or type $x^2$">&Sigma;</button>
    <span id="saved" class="saved">Saved</span>
  </div>`;
}

function render(){
  renderMenu();
  $("#view").innerHTML =
      view === "sources" && openSource ? viewSource()
    : view === "sources"  ? viewSources()
    : view === "progress" ? viewProgress()
    : view === "draft"    ? viewDraft()
    : view === "roadmap"  ? viewRoadmap()
    : viewContents();
  document.querySelectorAll("[contenteditable]").forEach(markEmpty);
  window.scrollTo(0, 0);
}

/* ---------- writing ---------- */
const markEmpty = el => el.classList.toggle("is-empty", !el.textContent.trim() && !el.querySelector("img,ul,li"));

function modelFor(kind){
  if(kind === "idea")    return data.ideas.find(x => x.id === openIdea);
  if(kind === "reading") return data.readings.find(x => x.id === openSource);
  return null;
}

function applyEdit(el){
  const [kind, field] = el.dataset.edit.split(".");
  const rich = el.dataset.rich === "1";
  const value = rich ? el.innerHTML : el.textContent.trim();
  if(kind === "draft")   data.drafts[openIdea] = value;
  else if(kind === "roadmap") data.roadmap = value;
  else {
    const m = modelFor(kind);
    if(m) m[field] = value;
  }
  save();
}

document.addEventListener("input", e => {
  const el = e.target.closest("[data-edit]");
  if(!el) return;
  markEmpty(el);
  applyEdit(el);
  const n = $("#wordnow");
  if(n && el.dataset.edit === "draft") n.textContent = words(el.innerHTML).toLocaleString();
});

/* The toolbar runs through execCommand, which is deprecated and still the only thing
   that writes to the browser's own undo stack — so ⌘Z keeps working. */
document.addEventListener("mousedown", e => {
  const b = e.target.closest(".tools button");
  if(b) e.preventDefault();                       // keep the caret where it is
});
document.addEventListener("click", e => {
  const b = e.target.closest(".tools button");
  if(!b) return;
  const cmd = b.dataset.cmd;
  if(cmd === "quote"){
    const inQuote = !!document.getSelection().anchorNode?.parentElement?.closest("blockquote");
    document.execCommand("formatBlock", false, inQuote ? "p" : "blockquote");
  } else if(cmd === "math"){
    document.execCommand("insertText", false, "$x$");
  } else {
    document.execCommand(cmd);
  }
  const host = b.closest(".rich")?.querySelector("[data-edit]");
  if(host){ markEmpty(host); applyEdit(host); }
});

/* Maths renders when the caret leaves, which keeps it from moving under your hands. */
const DISPLAY_RE = /(?<!\\)\$\$(?!\s)((?:[^$\\]|\\.|\$(?!\$))+?)(?<!\s)\$\$/;
const INLINE_RE  = /(?<![\\$])\$(?!\s|\$)((?:[^$\\\n]|\\.)+?)(?<!\s)\$(?!\d|\$)/;

function renderMathIn(el){
  if(typeof katex === "undefined") return false;
  let changed = false;
  for(const [re, display] of [[DISPLAY_RE, true], [INLINE_RE, false]]){
    let guard = 0;
    while(guard++ < 60){
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let hit = null, node;
      while((node = walker.nextNode())){
        if(node.parentElement.closest(".math")) continue;
        const m = re.exec(node.nodeValue);
        if(m){ hit = {node, m}; break; }
      }
      if(!hit) break;
      let html;
      try{
        html = katex.renderToString(hit.m[1], {output:"mathml", displayMode:display, throwOnError:true});
      }catch{ break; }                               // half-typed: leave it alone
      const span = document.createElement("span");
      span.className = "math";
      span.dataset.tex = hit.m[0];
      span.innerHTML = html;
      const after = hit.node.splitText(hit.m.index);
      after.nodeValue = after.nodeValue.slice(hit.m[0].length);
      after.parentNode.insertBefore(span, after);
      changed = true;
    }
  }
  return changed;
}

document.addEventListener("focusout", e => {
  const el = e.target.closest?.('[data-rich="1"]');
  if(!el) return;
  if(renderMathIn(el)) applyEdit(el);
}, true);

/* Click a rendered formula to get its source back. */
document.addEventListener("click", e => {
  const m = e.target.closest(".math");
  if(!m || !m.dataset.tex) return;
  const host = m.closest("[data-edit]");
  m.replaceWith(document.createTextNode(m.dataset.tex));
  if(host) applyEdit(host);
});

/* ---------- navigation ---------- */
const shell = $("#shell");
const narrow = () => window.matchMedia("(max-width:860px)").matches;
$("#close").addEventListener("click", () => {
  shell.classList.remove("shell--open");
  shell.classList.add("shell--shut");
});
$("#open").addEventListener("click", () => {
  shell.classList.remove("shell--shut");
  shell.classList.add("shell--open");
});

document.addEventListener("click", e => {
  const go = e.target.closest("[data-view]");
  if(go){
    view = go.dataset.view; openSource = null;
    if(narrow()) shell.classList.remove("shell--open");
    return render();
  }
  const src = e.target.closest("[data-src]");
  if(src){ view = "sources"; openSource = src.dataset.src; return render(); }
  const idea = e.target.closest("[data-idea]");
  if(idea){ view = "draft"; openIdea = idea.dataset.idea; openSource = null; return render(); }
});

render();
</script>

/* ==================== design notes ==================== */
function viewNotes(){
  return `<div class="doc">
    <span class="lbl">Design notes</span>
    <h1 style="margin-top:8px">Why it works this way</h1>
    <p class="doc__lede">Your sketch — ideas in a rail, a reading page of tiles, a writing page — is right, and this is built on it. I changed three things, and each change is arguable. Here is what and why, so you can overrule me.</p>

    <h2>1. The card is the load-bearing part</h2>
    <p>A reading list and a draft are the two visible halves of the job. The invisible half is the bit in between: the moment you remember that Scott said something about forestry, and go hunting for it. That hunt is where research projects die — not in the reading, and not in the writing.</p>
    <p>So the smallest unit here is not the paper. It is the <strong>card</strong>: one claim, quote, or objection, with its page reference attached. You make cards while reading, in the note page. They appear automatically in the <strong>evidence rail</strong> next to your draft, and clicking one drops it into the prose with the citation already formed.</p>
    <p>The payoff is a number you can see on every idea: <strong>unspent cards</strong>. Twelve unspent cards means you have done the reading and not yet done the writing. Zero unspent cards and a short draft means go read something. It is the single most useful signal in the whole tool, and it only exists because notes are broken into pieces rather than left as a wall of text.</p>
    <p>If this feels like overhead: it is optional. Write a summary and nothing else, and the tool degrades gracefully into exactly what you asked for.</p>
    <p>You suggested a dropdown on each tile for notes. I made it a full page instead, for one reason: a dropdown sets an expectation that what goes in it is short. The summary is the single highest-value thing you will write about a source — it is where you find out whether you actually understood it — and it deserves a page with room, not a drawer. The tile still tells you at a glance whether notes exist, which is the part a dropdown was really for.</p>

    <h2>2. Sources are shared, not owned</h2>
    <p>You described readings as living inside an idea. In practice a good source serves two or three ideas at once, and the moment you have to decide which folder a paper "belongs" to, you have added the exact friction you asked me to avoid.</p>
    <p>So: one <strong>library</strong>, and ideas are tags on it. Nothing about the interface changes — the reading page still shows only that idea's tiles. But adding an existing source to a second idea is one click, and your notes come with it.</p>

    <h2>3. Ideas have a temperature</h2>
    <p>An idea moves: spark → gathering → drafting → cutting → published. That is a real sequence, so the interface encodes it as one — the colour of an idea warms as it moves toward the camera, and the cockpit shows the whole pipeline at a glance. This is the "am I actually making progress" view, and it is the thing a plain folder tree can never give you.</p>

    <h2>Four ways this could have been organised</h2>
    <div class="opts">
      <div class="opt opt--pick">
        <div class="opt__h"><h3>Idea-first navigation, library-backed data</h3><span class="opt__tag">Built</span></div>
        <p>You navigate by idea, exactly as you sketched. Underneath, sources and cards live in one pool and are tagged. Best of both: simple mental model, no duplication, and cross-idea search comes free.</p>
      </div>
      <div class="opt">
        <div class="opt__h"><h3>Strict idea folders</h3></div>
        <p>Your original sketch, taken literally. Simplest possible model, and genuinely fine for the first six months. It breaks the first time a paper matters to two ideas, and it breaks quietly — you end up with two copies and notes in the wrong one.</p>
      </div>
      <div class="opt">
        <div class="opt__h"><h3>Note-first (zettelkasten)</h3></div>
        <p>Cards are primary, ideas are just clusters that emerge from links between them. Powerful for people who read very widely without knowing what they are making. Wrong here: you already know the output is an essay and then a video, and this model is famously good at generating notes and bad at generating finished work.</p>
      </div>
      <div class="opt">
        <div class="opt__h"><h3>Pure kanban board</h3></div>
        <p>Every idea a card, dragged across stage columns. Great overview, no depth — it tracks the project without holding any of the work. It survives here as the pipeline strip at the top of the cockpit, which is the useful 10% of it.</p>
      </div>
    </div>

    <h2>Adding a source has to cost about four seconds</h2>
    <p>The capture bar takes anything you can copy or drag, and works down a ladder, stopping at the first step that gives a real answer. The order matters: the cheapest and most reliable identifiers are tried first, and reading ink off the page is the last resort, not the first.</p>
    <ol class="ladder">
      <li><strong>An identifier in what you pasted.</strong> A DOI, an arXiv id, an ISBN, or a URL containing one. Crossref, arXiv and Open Library answer with the authoritative title and author list. No download happens at all — an arXiv link is resolved from the id in the URL, not by fetching the PDF.</li>
      <li><strong>An identifier printed inside the PDF.</strong> Nearly every published paper prints its own DOI in the footer of page 1, and preprints carry an arXiv stamp up the left margin. Both are found in the text layer and looked up. This is the step that fixes the common case.</li>
      <li><strong>The PDF's embedded metadata</strong> — but only after a sanity check. Half the papers you download claim to be titled <code>Microsoft Word - final_v3.doc</code> or <code>main.pdf</code>. Those are rejected rather than believed.</li>
      <li><strong>The page, read the way you read it.</strong> Text runs are grouped into blocks by type size and position; the largest block near the top is the title, and the first block below it that reads like names rather than prose is the byline. Superscript affiliation markers are stripped, a title wrapped over two lines is kept whole, and a wrapped subtitle is not mistaken for an author.</li>
      <li><strong>A check against Crossref.</strong> Whatever step 4 produced is searched for by title. If a record matches closely enough, the guess is replaced by the real one. If the top hit is a different paper, it is discarded rather than trusted.</li>
    </ol>
    <p>For a book there is no DOI, so the title page carries the load: the publisher line gives the imprint and tells the tool it is looking at a book rather than a paper.</p>

    <h3>What happens when it still cannot tell</h3>
    <p>This is the part that actually matters, and the part most tools get wrong. A resolver that fails silently and writes <em>Unknown author</em> is worse than one that fails loudly, because you find out six weeks later when you are writing the citation.</p>
    <p>So nothing is ever invented. No author, no year, no venue. If a step could not establish a field, the source lands with a <strong>Check</strong> flag and opens straight into a small form with everything that <em>was</em> found already filled in — usually you are typing one field, not four. The sidebar shows exactly which step produced which field, so when something is wrong you can see why. A scanned page with no text layer says so plainly and asks for a title.</p>
    <p>Unconfirmed is not the same as wrong: a title read off page 1 is perfectly usable, it just has not been checked against a registry, so it gets flagged. Anything a registry confirmed goes straight in.</p>

    <h3>The one real limitation</h3>
    <p>A browser cannot download a PDF from a site that refuses cross-origin requests, and most publishers do. The tool does not pretend otherwise: when a link cannot be fetched it says the site will not allow it and asks you to drag the file in instead, which always works. This is also why the identifier-first ordering matters — for arXiv, doi.org, PubMed Central and biorxiv the download never needs to happen.</p>

    <h2>How to actually run it</h2>
    <p><strong>A single local HTML file, no server, no password.</strong> You open it from your own disk. On first run it asks for a folder — say <code>~/Projects/marginalia</code> — and from then on it reads and writes:</p>
    <ul>
      <li><code>data.json</code> — ideas, sources, cards, notes.</li>
      <li><code>essays/*.md</code> — one plain markdown file per draft, so your writing is never trapped in this tool.</li>
      <li><code>pdfs/</code> — the papers themselves.</li>
    </ul>
    <p>That folder is a git repo, which gives you version history of every draft for free, and a backup by pushing it to a private remote. There is nothing to host, nothing to log into, and no account that can be shut down. It is also genuinely private in the way a password-protected site is not.</p>
    <p>The one thing you lose is your phone. If reading on the sofa and capturing a source from your phone matters, the upgrade path is small: the same file served by a ~50-line local server, reachable from your phone over Tailscale. I would not build that until you have wanted it twice.</p>

    <h2>Deliberately not here</h2>
    <ul>
      <li><strong>Due dates and priorities.</strong> This is your own project. A tool that can nag you about a self-imposed deadline is a tool you will start avoiding.</li>
      <li><strong>Rich text everywhere.</strong> Notes are plain, drafts are markdown. Formatting is procrastination in a costume.</li>
      <li><strong>A separate "notes" section.</strong> Notes belong to the thing they are about. There is no orphan-note inbox to feel guilty about.</li>
      <li><strong>Collaboration, sharing, export-to-anything.</strong> Nobody else is coming.</li>
    </ul>

    <h2>What I would build first</h2>
    <p>The cockpit, the capture bar, the tile grid, and the note page — that is the useful core and about a day's work. The evidence rail is the part worth getting right and can come second, once you have twenty real cards to test it against. Everything else is decoration.</p>
    <p style="color:var(--faint); font-size:13px; margin-top:26px">Every screen in this prototype is live — add a source, insert a card into the draft, type in the essay. Nothing persists on reload, which is the honest signal that this is a mockup.</p>
  </div>`;
}

/* ==================== router ==================== */
function render(){
  renderRail(); renderTopbar();
  const v = $("#view");
  v.classList.toggle("view--wide", state.view==="idea" && state.tab==="draft");
  if(state.view==="cockpit") v.innerHTML = viewCockpit();
  else if(state.view==="library") v.innerHTML = viewLibrary();
  else if(state.view==="notes")   v.innerHTML = viewNotes();
  else if(state.reading)          v.innerHTML = viewNote();
  else if(state.tab==="brief")    v.innerHTML = viewBrief();
  else if(state.tab==="draft")    v.innerHTML = viewDraft();
  else                            v.innerHTML = viewReading();
  $$(".pad").forEach(p=>{
    const sync=()=>p.dataset.empty = String(p.textContent.trim()==="");
    sync(); p.addEventListener("input", sync);
  });
}

/* ==================== capture ==================== */
/*
 * Lookups need Crossref / arXiv / Open Library. Opened from disk (file://) the browser
 * can call them directly — all three send permissive CORS headers and need no API key.
 * This hosted preview is sandboxed with no outbound network, so it replays recorded
 * responses instead. Same code path either way.
 */
const LIVE = location.protocol === "file:";

const RECORDED = [
  ["api.crossref.org/works/10.1073", {message:{DOI:"10.1073/pnas.0610172104",type:"journal-article",
    title:["Growth, innovation, scaling, and the pace of life in cities"],
    "container-title":["Proceedings of the National Academy of Sciences"],
    author:[{given:"Luís M. A.",family:"Bettencourt"},{given:"José",family:"Lobo"},{given:"Dirk",family:"Helbing"},
            {given:"Christian",family:"Kühnert"},{given:"Geoffrey B.",family:"West"}],
    "published-print":{"date-parts":[[2007,4,24]]}}}],
  ["api.crossref.org/works/10.1126", {message:{DOI:"10.1126/science.276.5309.122",type:"journal-article",
    title:["A General Model for the Origin of Allometric Scaling Laws in Biology"],
    "container-title":["Science"],
    author:[{given:"Geoffrey B.",family:"West"},{given:"James H.",family:"Brown"},{given:"Brian J.",family:"Enquist"}],
    "published-print":{"date-parts":[[1997,4,4]]}}}],
  ["api.crossref.org/works?", {message:{items:[
    {DOI:"10.1525/9780520314207-011",type:"journal-article",title:["The Tyranny of Structurelessness"],
     "container-title":["Berkeley Journal of Sociology"],author:[{given:"Jo",family:"Freeman"}],
     "published-print":{"date-parts":[[1972]]}}]}}],
  ["export.arxiv.org", `<?xml version="1.0"?><feed><entry><id>http://arxiv.org/abs/1911.01547v2</id>
    <published>2019-11-05T02:19:24Z</published><title>On the Measure of Intelligence</title>
    <summary>To make deliberate progress towards more intelligent systems, we need a clear
    definition of intelligence.</summary><author><name>François Chollet</name></author></entry></feed>`],
  ["openlibrary.org", {"ISBN:9780300078152":{title:"Seeing Like a State",
    subtitle:"How Certain Schemes to Improve the Human Condition Have Failed",
    authors:[{name:"James C. Scott"}],publish_date:"1998",
    publishers:[{name:"Yale University Press"}]}}],
];

async function appFetch(url){
  if(LIVE) return fetch(url);
  await new Promise(r=>setTimeout(r, 260));            // registries are not instant
  for(const [pattern, value] of RECORDED){
    if(url.includes(pattern)){
      const isText = typeof value === "string";
      return { ok:true, status:200, headers:{get:()=>isText?"application/xml":"application/json"},
               json:async()=>value, text:async()=>isText?value:JSON.stringify(value),
               arrayBuffer:async()=>new TextEncoder().encode(isText?value:JSON.stringify(value)).buffer };
    }
  }
  throw new TypeError("Failed to fetch");
}

/*
 * Real PDF parsing uses pdf.js, which this preview cannot load. The samples below are
 * genuine page-1 text runs extracted from real PDFs at build time, so the part that
 * actually does the work — the DOI scan and the layout heuristic — runs for real here.
 */
function sampleDocument(name){
  const s = PDF_SAMPLES[name];
  if(!s) return null;
  return {
    info: s.info, xmp:{title:null, creator:null},
    pages:[{ width:s.page.width, height:s.page.height,
             items:s.page.items.map(i=>({str:i.s, size:i.z, width:i.w, x:i.x, y:i.y, rotated:!!i.r})) }],
    text: s.page.items.map(i=>i.s).join(" "),
  };
}

const SAMPLES = [
  {label:"A DOI link",        input:"https://doi.org/10.1073/pnas.0610172104"},
  {label:"An arXiv PDF",      input:"https://arxiv.org/pdf/1911.01547v2.pdf"},
  {label:"A dropped PDF",     file:"freeman-structurelessness.pdf"},
  {label:"Two-line title",    file:"west-scaling.pdf"},
  {label:"A book title page", file:"scott-seeing-like-a-state.pdf"},
  {label:"A scan (no text)",  file:"scan-1972.pdf"},
];

/** Adds a tile, showing the resolver working as it goes. */
async function addSource(input, fileName){
  const tiles = $("#tiles"); if(!tiles) return;
  const ghost = document.createElement("div");
  ghost.className = "tile tile--ghost";
  ghost.innerHTML = `<div class="cover" style="--h:210"><span class="shimmer"></span>
      <span class="cover__kind">resolving…</span>
      <span class="cover__v" style="opacity:.5">${esc(fileName || String(input).slice(0,44))}</span></div>
    <span class="tile__steps" id="steps"></span>`;
  tiles.prepend(ghost);

  const steps = ghost.querySelector("#steps");
  const onStep = m => { steps.innerHTML += `<span class="step">${esc(m)}</span>`; };

  const deps = { fetch: appFetch, onStep };
  let payload = input;
  if(fileName){
    payload = { file:{ name:fileName, arrayBuffer:async()=>new ArrayBuffer(8) } };
    // stand-in for pdf.js: hand the resolver the pre-extracted runs for this sample.
    // A file with no sample leaves the resolver without a reader, and it says so.
    const sample = sampleDocument(fileName);
    if(sample) deps.readPdf = async () => sample;
  }

  let meta;
  try { meta = await resolveSource(payload, deps); }
  catch(err){ meta = { title:null, authors:[], confidence:"failed", needsReview:true,
                       provenance:["Something went wrong: "+err.message] }; }

  await new Promise(r=>setTimeout(r, 220));
  const r = {
    id:"n"+Date.now(),
    kind: meta.kind || "paper",
    title: meta.title || (fileName || "Untitled source"),
    authors: meta.authors || [],
    year: meta.year || null,
    venue: meta.venue || (fileName ? "Local file" : "Pasted link"),
    h: hueFor(meta.title || String(input)),
    ideas:[state.idea], status:"queued", summary:"", cards:[],
    confidence: meta.confidence, needsReview: meta.needsReview, provenance: meta.provenance,
    url: meta.url || (typeof input === "string" ? input : null), doi: meta.doi || null,
  };
  readings.unshift(r);
  state.filter = "all";
  render();
  const el = $(`[data-reading="${r.id}"] .cover`); if(el) el.classList.add("cover--new");
  if(r.needsReview) state.reading = r.id, render();   // a failure gets fixed now, not later
}

const hueFor = str => { let h=0; for(const c of String(str)) h=(h*31+c.charCodeAt(0))%360; return h; };

/* ==================== events ==================== */
document.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]");
  if(go){ state.view = go.dataset.go; state.reading = null; return render(); }

  const idea = e.target.closest("[data-idea]");
  if(idea){ state.view="idea"; state.idea=idea.dataset.idea; state.tab="reading"; state.reading=null; state.filter="all"; return render(); }

  const tab = e.target.closest("[data-tab]");
  if(tab){ state.tab = tab.dataset.tab; state.reading = null; return render(); }

  const row = e.target.closest("tr[data-reading]");
  if(row){ state.view="idea"; state.idea=row.dataset.jump; state.tab="reading"; state.reading=row.dataset.reading; return render(); }

  const tile = e.target.closest("[data-reading]");
  if(tile && tile.tagName==="BUTTON"){ state.reading = tile.dataset.reading; return render(); }

  if(e.target.closest("[data-back]")){ state.reading = null; return render(); }

  const flt = e.target.closest("[data-filter]");
  if(flt){ state.filter = flt.dataset.filter; return render(); }

  const sp = e.target.closest("[data-sample]");
  if(sp){ const x = SAMPLES[+sp.dataset.sample]; addSource(x.input, x.file); return; }

  const acc = e.target.closest("[data-accept]");
  if(acc){
    const r = readings.find(x=>x.id===acc.dataset.accept);
    r.title   = $("#rv-title").value.trim() || r.title;
    r.authors = $("#rv-authors").value.split(",").map(a=>a.trim()).filter(Boolean);
    r.year    = Number($("#rv-year").value) || r.year;
    r.venue   = $("#rv-venue").value.trim();
    r.needsReview = false;
    r.confidence = "checked";
    r.provenance = [...(r.provenance||[]), "Corrected by hand"];
    return render();
  }

  const ec = e.target.closest("[data-card]");
  if(ec){ insertCard(+ec.dataset.card); return; }

  const st = e.target.closest(".statusrow .filter");
  if(st){ $$(".statusrow .filter", st.parentElement).forEach(b=>b.setAttribute("aria-pressed","false"));
          st.setAttribute("aria-pressed","true"); return; }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="capture" && e.target.value.trim()){
    addSource(e.target.value.trim()); e.target.value=""; e.preventDefault();
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="cardsearch"){
    state.q = e.target.value;
    const list = $(".rail2__list"); if(!list) return;
    const all = cardsOf(state.idea);
    const cs = all
      .filter(c=>(c.q+c.src.title).toLowerCase().includes(state.q.toLowerCase()))
      .sort((a,b)=>Number(a.used)-Number(b.used));
    list.innerHTML = ecards(cs, all);
  }
});

/* the caret is where the quote belongs, not the end of the document */
let lastRange = null;
document.addEventListener("selectionchange", ()=>{
  const sel = document.getSelection();
  if(!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0), prose = $("#prose");
  if(prose && prose.contains(r.commonAncestorContainer)) lastRange = r.cloneRange();
});

function insertCard(n){
  const i = ideas.find(x=>x.id===state.idea);
  const c = cardsOf(i.id)[n]; if(!c) return;
  const prose = $("#prose"); if(!prose) return;
  const bq = document.createElement("blockquote");
  bq.className = "justin";
  bq.innerHTML = `${esc(c.q)}<cite>${esc(c.src.authors[0])}, <i>${esc(c.src.title)}</i> (${c.src.year}), ${esc(c.loc)}</cite>`;
  let block = null;
  if(lastRange && prose.contains(lastRange.commonAncestorContainer)){
    block = lastRange.commonAncestorContainer;
    if(block.nodeType===3) block = block.parentNode;
    while(block && block.parentNode !== prose) block = block.parentNode;
  }
  if(block) prose.insertBefore(bq, block.nextSibling); else prose.appendChild(bq);
  const real = c.src.cards.find(x=>x.q===c.q); if(real) real.used = true;
  bq.scrollIntoView({behavior:"smooth", block:"center"});
  const meter = $(".rail2__meter"); const all = cardsOf(i.id);
  if(meter) meter.textContent = `${all.filter(x=>x.used).length}/${all.length} spent`;
  const btn = $(`[data-card="${n}"]`);
  if(btn){ btn.classList.add("ecard--used"); const s = btn.querySelector(".ecard__s span:last-child");
           if(s){ s.textContent="✓ used"; s.className="ecard__used"; } }
}

/* ==================== drag and drop ==================== */
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev, e=>{
  if(!$("#capture")) return;
  e.preventDefault();
  $(".capture")?.classList.add("capture--over");
}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev, e=>{
  if(ev==="dragleave" && e.relatedTarget) return;
  $(".capture")?.classList.remove("capture--over");
}));
document.addEventListener("drop", e=>{
  const files = [...(e.dataTransfer?.files||[])].filter(f=>/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if(!files.length || !$("#tiles")) return;
  e.preventDefault();
  // Locally this hands the bytes straight to pdf.js; in this preview a dropped file
  // has no matching sample, so it resolves by filename and lands in review.
  files.forEach(f=>addSource({file:f}, f.name));
});

/* ==================== theme ==================== */
const MODES = ["Auto","Light","Dark"]; let mode = 0;
$("#themebtn").addEventListener("click", ()=>{
  mode = (mode+1)%3;
  $("#thememode").textContent = MODES[mode];
  if(mode===0) document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", MODES[mode].toLowerCase());
});

render();
</script>

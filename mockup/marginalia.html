<title>Marginalia Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400..700;1,400..600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --ground:#E9EBEE; --surface:#FAFBFC; --surface-2:#F1F3F6; --surface-3:#E3E7EC;
  --ink:#14181D; --ink-2:#3D454F; --muted:#6E7884; --faint:#98A2AE;
  --line:#D5DAE1; --line-soft:#E4E8ED;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --accent-soft:rgba(43,76,126,.10);
  --s1:#4A5BAA; --s2:#2C7FA0; --s3:#A97C24; --s4:#BC5F2C; --s5:#9A382F;
  --good:#3F7D53; --warn:#A97C24;
  --cover-s:30%; --cover-l:87%; --cover-ink-l:26%; --cover-rule:.55;
  --shadow:0 1px 2px rgba(20,24,29,.05), 0 8px 24px -12px rgba(20,24,29,.18);
  --shadow-lift:0 2px 4px rgba(20,24,29,.06), 0 18px 40px -18px rgba(20,24,29,.30);
  --sans:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Faustina", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101317; --surface:#181C21; --surface-2:#1F242A; --surface-3:#272D35;
    --ink:#E9ECF0; --ink-2:#B8C0CA; --muted:#8A94A1; --faint:#6C7683;
    --line:#2C333B; --line-soft:#232930;
    --accent:#84AAD9; --accent-ink:#0F1317; --accent-soft:rgba(132,170,217,.15);
    --s1:#8590E0; --s2:#4FAAC9; --s3:#D2A241; --s4:#E08351; --s5:#D2695E;
    --good:#6FB187; --warn:#D2A241;
    --cover-s:24%; --cover-l:23%; --cover-ink-l:82%; --cover-rule:.30;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ground:#101317; --surface:#181C21; --surface-2:#1F242A; --surface-3:#272D35;
  --ink:#E9ECF0; --ink-2:#B8C0CA; --muted:#8A94A1; --faint:#6C7683;
  --line:#2C333B; --line-soft:#232930;
  --accent:#84AAD9; --accent-ink:#0F1317; --accent-soft:rgba(132,170,217,.15);
  --s1:#8590E0; --s2:#4FAAC9; --s3:#D2A241; --s4:#E08351; --s5:#D2695E;
  --good:#6FB187; --warn:#D2A241;
  --cover-s:24%; --cover-l:23%; --cover-ink-l:82%; --cover-rule:.30;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.75);
}

/* ============ base ============ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-family:var(--serif); font-weight:600; text-wrap:balance; letter-spacing:-.005em}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.lbl{
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--faint);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ shell ============ */
.app{display:grid; grid-template-columns:258px minmax(0,1fr); min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:6px; padding:18px 0 14px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:baseline; gap:8px; padding:0 18px 14px}
.brand__mark{
  font-family:var(--serif); font-size:23px; font-weight:700; letter-spacing:-.02em;
}
.brand__dot{width:7px;height:7px;border-radius:50%;background:var(--s3);transform:translateY(-3px)}
.brand__sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase}

.nav{display:flex; flex-direction:column; gap:1px; padding:0 10px}
.nav__item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border-radius:7px; color:var(--ink-2); font-size:14px;
}
.nav__item:hover{background:var(--surface-2)}
.nav__item[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:500}
.nav__ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav__count{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint)}

.rail__head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 19px 7px; margin-top:8px; border-top:1px solid var(--line-soft);
}
.rail__add{
  width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted); font-size:15px; line-height:1;
}
.rail__add:hover{background:var(--surface-2); color:var(--ink)}

.ideanav{display:flex; flex-direction:column; gap:1px; padding:0 10px}
.ideanav__item{
  display:grid; grid-template-columns:3px 1fr; gap:9px; width:100%; text-align:left;
  padding:7px 9px 7px 7px; border-radius:7px; align-items:center;
}
.ideanav__item:hover{background:var(--surface-2)}
.ideanav__item[aria-current="true"]{background:var(--surface-2)}
.ideanav__bar{height:calc(100% - 2px); min-height:26px; border-radius:2px; background:var(--stage)}
.ideanav__t{font-size:13.5px; line-height:1.35; color:var(--ink-2)}
.ideanav__item[aria-current="true"] .ideanav__t{color:var(--ink); font-weight:500}
.ideanav__m{display:block; font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:3px}

.rail__foot{margin-top:auto; padding:14px 18px 0; border-top:1px solid var(--line-soft); display:flex; align-items:center; gap:10px}
.themebtn{
  display:flex;align-items:center;gap:7px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:4px 7px; border-radius:6px;
}
.themebtn:hover{background:var(--surface-2); color:var(--ink-2)}

/* ============ stage / topbar ============ */
.stage{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:0 30px; display:flex; align-items:flex-end; gap:22px; min-height:56px;
}
.crumb{display:flex; align-items:center; gap:9px; padding-bottom:13px; align-self:center}
.crumb__t{font-family:var(--serif); font-size:17px; font-weight:600}
.crumb__stage{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--stage); border:1px solid color-mix(in srgb, var(--stage) 40%, transparent);
  background:color-mix(in srgb, var(--stage) 11%, transparent);
  padding:2px 7px; border-radius:20px;
}
.tabs{display:flex; gap:2px; align-self:flex-end}
.tab{
  padding:9px 13px 11px; font-size:13.5px; color:var(--muted);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-current="true"]{color:var(--ink); border-bottom-color:var(--stage,var(--accent)); font-weight:500}
.tab__n{font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-left:5px}
.topbar__right{margin-left:auto; align-self:center; padding-bottom:13px; display:flex; gap:8px; align-items:center}

.view{padding:30px; max-width:1320px; width:100%}
.view--wide{max-width:none}

/* ============ generic bits ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:7px;
  border:1px solid var(--line); background:var(--surface); font-size:13px; color:var(--ink-2);
  box-shadow:0 1px 1px rgba(20,24,29,.03);
}
.btn:hover{background:var(--surface-2); color:var(--ink)}
.btn--primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:500}
.btn--primary:hover{background:var(--accent); filter:brightness(1.08); color:var(--accent-ink)}
.btn--ghost{border-color:transparent; background:none}
.btn--ghost:hover{background:var(--surface-2)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.chip{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  padding:2.5px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); white-space:nowrap;
}
.chip--read{color:var(--good); border-color:color-mix(in srgb, var(--good) 38%, transparent); background:color-mix(in srgb, var(--good) 10%, transparent)}
.chip--reading{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); background:color-mix(in srgb, var(--warn) 10%, transparent)}
.chip--queued{color:var(--faint)}

/* ============ cockpit ============ */
.hero{display:flex; align-items:flex-end; justify-content:space-between; gap:30px; margin-bottom:24px}
.hero h1{font-size:30px; line-height:1.15}
.hero p{color:var(--muted); font-size:14.5px; margin-top:7px; max-width:56ch}
.gauges{display:flex; gap:0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.gauge{padding:11px 18px; border-right:1px solid var(--line-soft); min-width:92px}
.gauge:last-child{border-right:0}
.gauge__n{font-family:var(--mono); font-size:21px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; display:block; line-height:1.1}
.gauge__l{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-top:3px; display:block}

.pipeline{display:flex; gap:0; align-items:stretch; margin:0 0 26px; border-radius:var(--r); overflow:hidden; border:1px solid var(--line)}
.pipeline__seg{flex:1; padding:9px 12px; background:var(--surface); border-right:1px solid var(--line-soft); position:relative}
.pipeline__seg:last-child{border-right:0}
.pipeline__seg::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--stage)}
.pipeline__l{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--stage)}
.pipeline__n{font-family:var(--mono); font-size:17px; color:var(--ink-2); margin-top:2px}

.ideas{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px}
.idea{
  display:flex; flex-direction:column; text-align:left; padding:0; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); transition:transform .16s ease, box-shadow .16s ease;
}
.idea:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.idea__ramp{display:flex; height:4px}
.idea__ramp i{flex:1; background:var(--line-soft)}
.idea__body{padding:16px 18px 14px; flex:1; display:flex; flex-direction:column; gap:9px}
.idea__top{display:flex; align-items:center; gap:8px}
.idea__title{font-size:19px; line-height:1.25}
.idea__blurb{color:var(--muted); font-family:var(--serif); font-size:15px; line-height:1.55}
.idea__stats{display:flex; gap:14px; margin-top:auto; padding-top:11px; border-top:1px solid var(--line-soft)}
.stat{display:flex; flex-direction:column; gap:1px}
.stat__n{font-family:var(--mono); font-size:13px; color:var(--ink-2)}
.stat__l{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.idea__next{
  display:flex; align-items:center; gap:8px; padding:9px 18px;
  background:var(--surface-2); border-top:1px solid var(--line-soft);
  font-size:12.5px; color:var(--ink-2);
}
.idea__next b{font-weight:500; color:var(--stage)}

/* ============ reading grid ============ */
.capture{
  display:flex; gap:10px; align-items:center; padding:10px 12px; margin-bottom:20px;
  background:var(--surface); border:1px dashed var(--line); border-radius:var(--r);
}
.capture:focus-within{border-color:var(--accent); border-style:solid; box-shadow:0 0 0 3px var(--accent-soft)}
.capture__in{
  flex:1; border:0; background:none; outline:none; font-size:14px; padding:4px 2px; min-width:0;
}
.capture__in::placeholder{color:var(--faint)}
.capture__hint{font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.05em; white-space:nowrap}

.capture__samples{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:-10px 0 18px}
.sample{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.02em; padding:3px 9px; border-radius:20px;
  border:1px solid var(--line); color:var(--muted); background:var(--surface);
}
.sample:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.capture--over{border-color:var(--accent); border-style:solid; background:var(--accent-soft)}

.tile__steps{display:flex; flex-direction:column; gap:2px; min-height:34px}
.step{
  font-family:var(--mono); font-size:9.5px; line-height:1.35; color:var(--muted);
  animation:stepin .3s ease both;
}
.step::before{content:"› "; color:var(--faint)}
@keyframes stepin{from{opacity:0; transform:translateY(-2px)} to{opacity:1; transform:none}}

.chip--check{
  color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent);
  background:color-mix(in srgb, var(--warn) 12%, transparent);
}
.tile--review .cover{outline:2px solid color-mix(in srgb, var(--warn) 55%, transparent); outline-offset:2px}

.review{
  border:1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  background:color-mix(in srgb, var(--warn) 7%, transparent);
  border-radius:var(--r); padding:15px 17px; margin-bottom:22px;
}
.review__h{display:flex; align-items:center; gap:9px; margin-bottom:4px}
.review__h h3{font-size:14px; color:var(--warn)}
.review__why{font-size:13px; color:var(--ink-2); margin-bottom:13px; max-width:62ch}
.review__grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px}
.review__grid label{display:flex; flex-direction:column; gap:4px}
.review__grid span{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint)}
.review__grid input{
  border:1px solid var(--line); border-radius:7px; padding:7px 10px; background:var(--surface);
  font-size:14px; outline:none; width:100%;
}
.review__grid input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.review__grid label.wide{grid-column:1 / -1}
.review__act{display:flex; gap:8px; align-items:center; margin-top:13px}
.trail{display:flex; flex-direction:column; gap:5px}
.trail li{font-family:var(--mono); font-size:10.5px; color:var(--muted); line-height:1.4; list-style:none}
.trail li::before{content:"› "; color:var(--faint)}
.trail{margin:0; padding:0}

.filters{display:flex; gap:6px; align-items:center; margin-bottom:16px; flex-wrap:wrap}
.filter{padding:4px 10px; border-radius:20px; font-size:12.5px; color:var(--muted); border:1px solid transparent}
.filter:hover{background:var(--surface-2)}
.filter[aria-pressed="true"]{background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow)}

.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:18px}
.tile{
  display:flex; flex-direction:column; gap:9px; text-align:left; padding:0;
  transition:transform .16s ease;
}
.tile:hover{transform:translateY(-3px)}
.tile__cap{flex:1}
.tile__t{display:block; font-family:var(--serif); font-size:15px; line-height:1.3; font-weight:600}
.tile:hover .tile__t{color:var(--accent)}
.tile__a{font-size:12px; color:var(--muted); line-height:1.35}
.tile__foot{display:flex; align-items:center; gap:6px; margin-top:1px}
.tile__note{
  font-family:var(--mono); font-size:10px; color:var(--faint);
  display:inline-flex; align-items:center; gap:3px; margin-left:auto;
}
.tile__note--has{color:var(--accent)}

/* generated covers — deterministic art, since papers have no jacket */
.cover{
  position:relative; aspect-ratio:3/4; border-radius:6px; overflow:hidden;
  background:hsl(var(--h) var(--cover-s) var(--cover-l));
  box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:flex-end;
  padding:10px 10px 11px; isolation:isolate;
}
.tile:hover .cover{box-shadow:var(--shadow-lift)}
.cover__kind{
  position:absolute; top:9px; left:10px; z-index:2;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.13em; text-transform:uppercase;
  color:hsl(var(--h) 30% var(--cover-ink-l)); opacity:.62;
}
.cover__mono{
  position:absolute; left:6px; bottom:22%; z-index:1;
  font-family:var(--serif); font-size:82px; font-weight:700; line-height:.72;
  color:hsl(var(--h) 45% var(--cover-ink-l)); opacity:.17; pointer-events:none;
}
.cover__v{
  position:relative; z-index:2; font-family:var(--mono); font-size:9px; line-height:1.35;
  color:hsl(var(--h) 32% var(--cover-ink-l)); opacity:.8;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.cover__cards{
  position:absolute; top:8px; right:9px; z-index:3; font-family:var(--mono); font-size:9px;
  background:hsl(var(--h) 40% var(--cover-ink-l)); color:hsl(var(--h) var(--cover-s) var(--cover-l));
  border-radius:20px; padding:1px 6px; opacity:.9;
}
/* form tells you the kind at a glance */
.cover--paper::before{           /* ruled column of text */
  content:""; position:absolute; left:10px; right:10px; top:26px; height:46%; z-index:1;
  background:repeating-linear-gradient(to bottom,
    hsl(var(--h) 35% var(--cover-ink-l) / var(--cover-rule)) 0 1px, transparent 1px 6px);
  -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);
  mask-image:linear-gradient(to bottom,#000 55%,transparent);
}
.cover--book::before{            /* a spine */
  content:""; position:absolute; inset:0 auto 0 0; width:12px; z-index:2;
  background:hsl(var(--h) 42% calc(var(--cover-l) - 9%));
  border-right:1px solid hsl(var(--h) 35% var(--cover-ink-l) / .18);
}
.cover--book{padding-left:21px}
.cover--book .cover__kind{left:21px}
.cover--book .cover__mono{left:16px}
.cover--essay::before{           /* a printed rule, as a magazine page */
  content:""; position:absolute; left:10px; right:10px; top:26px; height:3px; z-index:1;
  border-top:1px solid hsl(var(--h) 35% var(--cover-ink-l) / .5);
  border-bottom:1px solid hsl(var(--h) 35% var(--cover-ink-l) / .5);
}
.cover--talk::before{            /* a play button */
  content:""; position:absolute; top:30px; right:12px; width:24px; height:24px; border-radius:50%; z-index:2;
  border:2px solid hsl(var(--h) 40% var(--cover-ink-l) / .38);
}
.cover--talk::after{
  content:""; position:absolute; top:39px; right:20px; z-index:2;
  border-left:8px solid hsl(var(--h) 40% var(--cover-ink-l) / .45);
  border-top:5px solid transparent; border-bottom:5px solid transparent;
}
.cover--new{animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.9); opacity:0} to{transform:scale(1); opacity:1}}
.tile--ghost .cover{background:var(--surface-2); box-shadow:none; border:1px solid var(--line)}
.shimmer{
  position:absolute; inset:0; z-index:4;
  background:linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--ink) 8%, transparent) 45%, transparent 70%);
  background-size:250% 100%; animation:sweep 1.05s linear infinite;
}
@keyframes sweep{from{background-position:180% 0} to{background-position:-80% 0}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

/* ============ note panel (reading detail) ============ */
.note{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:34px; align-items:start; max-width:1090px}
.note__back{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:14px}
.note__back:hover{color:var(--ink)}
.note__title{font-size:27px; line-height:1.2}
.note__authors{color:var(--muted); font-size:14px; margin-top:6px}
.note__venue{font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-top:4px}

/**
 * resolve.js — turn whatever the user pasted or dropped into real bibliographic fields.
 *
 * No dependencies. Everything that touches the outside world (fetch, PDF parsing)
 * is injected, so this file is testable in node and usable from a file:// page.
 *
 *   const meta = await resolveSource(input, { fetch, getDocument });
 *
 * Returns { title, authors[], year, venue, kind, doi, url, confidence, provenance[], needsReview }
 * confidence: "confirmed" (a registry agreed) | "likely" | "guess" | "failed"
 *
 * The contract that matters: this NEVER invents an author. If it cannot find one it
 * returns needsReview so the interface can ask, rather than writing "Unknown author".
 */

/* ------------------------------------------------------------------ identifiers */

// Crossref's own recommended pattern, plus a trailing-punctuation trim.
const DOI_RE = /\b(10\.\d{4,9}\/[-._;()/:a-z0-9<>+\[\]]+)/gi;
const ARXIV_NEW = /arxiv[:\s/]*(\d{4}\.\d{4,5})(v\d+)?/i;
const ARXIV_OLD = /arxiv[:\s/]*([a-z-]+(?:\.[a-z]{2})?\/\d{7})(v\d+)?/i;
const ISBN_RE = /\b(?:isbn[:\s-]*)?((?:97[89][-\s]?)?(?:\d[-\s]?){9}[\dxX])\b/i;
const PMCID_RE = /\bPMC(\d{6,8})\b/i;

/** A DOI printed in a PDF usually collides with the punctuation after it. */
function tidyDoi(raw) {
  let d = raw.trim().replace(/[.,;:]+$/, "");
  // drop a trailing ) only if it is unbalanced
  while (d.endsWith(")") && (d.match(/\)/g) || []).length > (d.match(/\(/g) || []).length) {
    d = d.slice(0, -1);
  }
  // PDF text layers love to weld the next word on; cut at whitespace
  return d.split(/\s/)[0].toLowerCase();
}

/** Pull every identifier we can out of an arbitrary string (a URL, a citation, page text). */
function parseIdentifiers(text) {
  const s = String(text || "");
  const out = {};

  const doiMatch = s.match(DOI_RE);
  if (doiMatch) out.doi = tidyDoi(doiMatch[0]);

  // arxiv.org/abs/2401.12345 and arxiv.org/pdf/2401.12345v2 both carry the id in the path
  const arxivUrl = s.match(/arxiv\.org\/(?:abs|pdf)\/([^\s?#]+?)(?:v\d+)?(?:\.pdf)?(?:[?#]|$)/i);
  if (arxivUrl) out.arxiv = arxivUrl[1];
  else {
    const a = s.match(ARXIV_NEW) || s.match(ARXIV_OLD);
    if (a) out.arxiv = a[1];
  }

  const pmc = s.match(PMCID_RE) || s.match(/ncbi\.nlm\.nih\.gov\/pmc\/articles\/PMC(\d+)/i);
  if (pmc) out.pmcid = "PMC" + pmc[1];

  // Only trust a bare ISBN if the string says so, or it is an isbn-shaped URL segment;
  // otherwise long digit runs in page text produce nonsense.
  if (/isbn/i.test(s) || /openlibrary|goodreads|worldcat/i.test(s)) {
    const isbn = s.match(ISBN_RE);
    if (isbn) out.isbn = isbn[1].replace(/[-\s]/g, "");
  }
  return out;
}

/* ------------------------------------------------------------------ text hygiene */

const FILE_EXT = /\.(docx?|pdf|tex|dvi|qxd|indd|rtf|odt|pptx?|ps|eps)$/i;
const GENERIC = /^(untitled|document\d*|microsoft word|powerpoint presentation|manuscript|paper|preprint|main|draft|final|new document|no title)$/i;

/** PDF Info dictionaries are full of build artefacts. Reject them rather than trust them. */
function isJunkTitle(t) {
  if (!t) return true;
  const s = String(t).trim();
  if (s.length < 6) return true;
  if (FILE_EXT.test(s)) return true;                    // "paper.dvi", "main.pdf"
  if (/^microsoft word\s*-/i.test(s)) return true;      // "Microsoft Word - final_v3.doc"
  if (GENERIC.test(s)) return true;
  if (!/\s/.test(s) && /[_\d]/.test(s)) return true;    // "structurelessness_FINAL_v3"
  if (/^[\w.-]+$/.test(s) && /\d/.test(s)) return true; // bare filename-ish token
  if (!/[a-z]/.test(s) && s.length < 12) return true;   // stray ALLCAPS fragment
  return false;
}

function cleanTitle(t) {
  return String(t || "")
    .replace(/\s*[\r\n]+\s*/g, " ")
    .replace(/^\s*(?:microsoft word\s*-\s*)?/i, "")
    .replace(/\s{2,}/g, " ")
    .replace(/[*†‡§¶]/g, "")
    .trim()
    .replace(/[.,;:]$/, "");
}

// Words that show up in titles and subtitles but essentially never in an author list.
const PROSE_WORDS = /\b(the|of|a|an|to|in|for|on|with|how|why|what|that|from|have|has|been|its|toward|towards|against|between|through|about)\b/gi;
const PUBLISHER_RE = /\b(press|publish\w*|books|verlag|editions|éditions|imprint|&\s*co\b)/i;
const AFFIL_WORDS = /\b(universit|institut|department|laborator|college|school|academ|centre|center|inc\.|llc|gmbh|hospital|foundation|press|dept)\w*/i;

/**
 * Title pages letter-space their capitals: "J A M E S   C .   S C O T T".
 * Where the PDF keeps each glyph as its own run, toLines() has already put the word
 * breaks back from the x-gaps. Where it does not — pdf.js merges the whole line into
 * one string — every gap looks identical and the word breaks are gone. The one boundary
 * still recoverable is a lone capital with a period: that is a middle initial, so a
 * word ends before it and another begins after.
 */
function deSpaceCapitals(str) {
  const s = String(str || "");
  if (!/^(?:\p{Lu}\s+){3,}/u.test(s + " ")) return s;
  return s
    .replace(/(?<=\p{L})\s(?=\p{L}\b)/gu, "")
    .replace(/\s+\./g, ".")
    .replace(/(\p{Lu}{2,})(\p{Lu}\.)/gu, "$1 $2")   // JAMESC. → JAMES C.
    .replace(/(\.)(\p{Lu}{2,})/gu, "$1 $2")         // C.SCOTT → C. SCOTT
    .replace(/\s{2,}/g, " ")
    .trim();
}

/** Does this line read like a byline rather than a title, subtitle, or affiliation? */
function looksLikeAuthorLine(line) {
  const s = deSpaceCapitals(String(line || "").trim());
  if (!s || s.length > 320) return false;
  if (s.includes("@")) return false;
  if (AFFIL_WORDS.test(s)) return false;
  if (/^\s*(abstract|introduction|keywords|contents|chapter)\b/i.test(s)) return false;
  if (/^\d/.test(s)) return false;
  const prose = (s.match(PROSE_WORDS) || []).length;
  if (prose >= 2) return false;                          // a subtitle, not a byline
  return /\p{Lu}\p{L}+/u.test(s);                        // contains at least one capitalised word
}

/** "Luís M. A. Bettencourt*†, José Lobo‡, and Geoffrey B. West¶" → three clean names. */
function parseAuthorLine(line) {
  let s = deSpaceCapitals(String(line || "").trim());
  if (!s) return [];

  s = s
    .replace(/^\s*(?:by|authors?|written by)\s*[:.]?\s*/i, "")
    .replace(/[*†‡§¶]/g, "")
    .replace(/\((?:[^)]*)\)/g, " ")          // "(corresponding author)"
    .replace(/(\p{L})\d+\b/gu, "$1")         // affiliation superscripts rendered as digits
    .replace(/\s{2,}/g, " ");

  return s
    .split(/\s*(?:,|;|\band\b|&|·)\s*/i)
    .map(n => n.replace(/^\s*and\s+/i, "").trim().replace(/[.,;:]$/, ""))
    .filter(n =>
      n.length > 1 &&
      /\p{L}/u.test(n) &&
      !/^\p{L}\.?$/u.test(n) &&              // a stray initial orphaned by the split
      !AFFIL_WORDS.test(n) &&
      !n.includes("@")
    )
    .slice(0, 24);
}

/* ------------------------------------------------------------------ PDF reading */

/**
 * Read a PDF with pdf.js. `getDocument` is injected so this works in node and browser.
 * Returns embedded metadata plus positioned text runs for page 1.
 */
async function readPdf(data, { getDocument, maxPages = 3 } = {}) {
  const doc = await getDocument({ data, useSystemFonts: true }).promise;
  let info = {}, metadata = null;
  try {
    const m = await doc.getMetadata();
    info = m.info || {};
    metadata = m.metadata || null;
  } catch { /* some PDFs have no metadata at all */ }

  const pages = [];
  const limit = Math.min(doc.numPages, maxPages);
  for (let i = 1; i <= limit; i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    const vp = page.getViewport({ scale: 1 });
    pages.push({
      height: vp.height,
      width: vp.width,
      items: tc.items.filter(it => it.str !== undefined).map(it => {
        const t = it.transform || [1, 0, 0, 1, 0, 0];
        return {
          str: it.str,
          size: Math.hypot(t[2], t[3]) || it.height || 0,
          width: it.width || 0,
          x: t[4],
          y: t[5],
          rotated: Math.abs(t[1]) > 0.01 || Math.abs(t[2]) > 0.01,
        };
      }),
    });
  }
  await doc.destroy?.();

  const text = pages.map(p => p.items.map(i => i.str).join(" ")).join("\n");
  // XMP holds the good metadata when the Info dict is a build artefact
  const xmp = {
    title: metadata?.get?.("dc:title") || null,
    creator: metadata?.get?.("dc:creator") || null,
  };
  return { info, xmp, pages, text };
}

/** Merge positioned runs into lines, biggest-font-first, with junk dropped. */
function toLines(page) {
  const rows = new Map();
  for (const it of page.items) {
    if (it.rotated) continue;                 // margin stamps are never the title
    if (!it.str.trim()) continue;
    const key = Math.round(it.y / 2) * 2;     // 2pt tolerance
    if (!rows.has(key)) rows.set(key, []);
    rows.get(key).push(it);
  }
  return [...rows.entries()]
    .map(([y, items]) => {
      items.sort((a, b) => a.x - b.x);
      let text = "";
      items.forEach((it, n) => {
        const prev = items[n - 1];
        if (prev) {
          const gap = it.x - (prev.x + prev.width);
          const wide = gap > 0.28 * (prev.size || it.size);
          if (wide && !/\s$/.test(text) && !/^\s/.test(it.str)) text += " ";
        }
        text += it.str;
      });
      return {
        y,
        size: Math.max(...items.map(i => i.size)),
        text: text.replace(/\s{2,}/g, " ").trim(),
      };
    })
    .filter(l => l.text.length > 2)
    .filter(l => !/^(downloaded from|©|copyright|all rights reserved|page \d+|\d+$)/i.test(l.text))
    .sort((a, b) => b.y - a.y);               // PDF origin is bottom-left: top of page first
}

/**
 * Group lines into blocks of one type size sitting close together. Titles, subtitles and
 * bylines all wrap, and a wrapped subtitle's last line ("Condition Have Failed") reads
 * exactly like a byline until you put it back together with the line above it.
 */
function toBlocks(page) {
  const lines = toLines(page);
  const blocks = [];
  for (const l of lines) {
    const prev = blocks[blocks.length - 1];
    const sameSize = prev && Math.abs(prev.size - l.size) < 0.6;
    const adjacent = prev && prev.lastY - l.y < prev.size * 2.2;   // still the same paragraph
    if (sameSize && adjacent) {
      prev.lines.push(l.text);
      prev.lastY = l.y;
    } else {
      blocks.push({ size: l.size, y: l.y, lastY: l.y, lines: [l.text] });
    }
  }
  return blocks.map(b => ({ ...b, text: b.lines.join(" ").replace(/\s{2,}/g, " ").trim() }));
}

/**
 * The fallback that matters: no DOI, no usable metadata, just ink on a page.
 * The title is the largest type near the top; the byline is the first block under it
 * that reads like names rather than prose.
 */
function guessFromLayout(page) {
  const blocks = toBlocks(page);
  if (!blocks.length) return { title: null, authors: [], confidence: "failed" };

  const top = blocks.filter(b => b.y > page.height * 0.45);
  const pool = top.length ? top : blocks.slice(0, 6);
  const maxSize = Math.max(...pool.map(b => b.size));

  const ti = blocks.findIndex(b => b.size >= maxSize - 0.6 && pool.includes(b));
  const title = cleanTitle(blocks[ti].text);

  let authors = [], authorAt = -1;
  for (let i = ti + 1; i < Math.min(blocks.length, ti + 5); i++) {
    if (!looksLikeAuthorLine(blocks[i].text)) continue;
    const parsed = parseAuthorLine(blocks[i].text);
    if (parsed.length) { authors = parsed; authorAt = i; break; }
  }

  // A title page carries its own imprint: the publisher line and the year are right there.
  let venue = "", year = null, kind = "paper";
  for (const b of blocks.slice(authorAt > 0 ? authorAt + 1 : ti + 1)) {
    if (!venue && PUBLISHER_RE.test(b.text)) {
      venue = b.text.split(/\s+[·|]\s+|\s{2,}/)[0].trim().replace(/[.,;:]$/, "");
      kind = "book";
    }
    if (!year) year = Number((b.text.match(/\b(1[6-9]\d\d|20[0-2]\d)\b/) || [])[1]) || null;
    if (venue && year) break;
  }

  const ok = title && title.length >= 8 && authors.length > 0;
  return { title: title || null, authors, venue, year, kind, confidence: ok ? "guess" : "failed" };
}

class LookupError extends Error {
  constructor(msg, code) { super(msg); this.code = code; }
}

async function getJson(url, fetchImpl, headers = {}) {
  let res;
  try {
    res = await fetchImpl(url, { headers });
  } catch (e) {
    // A browser reports a CORS refusal as a TypeError with no status.
    throw new LookupError(`Could not reach ${new URL(url).host}`, "network");
  }
  if (!res.ok) throw new LookupError(`${new URL(url).host} returned ${res.status}`, "http");
  return res.json();
}

const yearOf = m =>
  m?.["published-print"]?.["date-parts"]?.[0]?.[0] ||
  m?.["published-online"]?.["date-parts"]?.[0]?.[0] ||
  m?.issued?.["date-parts"]?.[0]?.[0] || null;

const CROSSREF_KIND = { "book": "book", "monograph": "book", "book-chapter": "book", "posted-content": "paper" };

function fromCrossrefWork(w) {
  if (!w) return null;
  const authors = (w.author || [])
    .map(a => [a.given, a.family].filter(Boolean).join(" ").trim() || a.name)
    .filter(Boolean);
  return {
    title: cleanTitle(Array.isArray(w.title) ? w.title[0] : w.title),
    authors,
    year: yearOf(w),
    venue: (Array.isArray(w["container-title"]) ? w["container-title"][0] : w["container-title"]) ||
           w.publisher || "",
    kind: CROSSREF_KIND[w.type] || "paper",
    doi: w.DOI || null,
    url: w.URL || (w.DOI ? "https://doi.org/" + w.DOI : null),
  };
}

async function fromCrossref(doi, fetchImpl) {
  const j = await getJson(`https://api.crossref.org/works/${encodeURIComponent(doi)}`, fetchImpl);
  return fromCrossrefWork(j.message);
}

/** No DOI, but we have a title guess — ask Crossref whether that paper exists. */
async function confirmByTitle(title, authors, fetchImpl) {
  const q = new URLSearchParams({ "query.bibliographic": title, rows: "3", select: "title,author,issued,container-title,DOI,type,publisher,URL" });
  if (authors?.length) q.set("query.author", authors[0]);
  const j = await getJson(`https://api.crossref.org/works?${q}`, fetchImpl);
  const items = j.message?.items || [];
  for (const w of items) {
    const cand = fromCrossrefWork(w);
    if (cand && titleSimilarity(cand.title, title) > 0.82) return cand;
  }
  return null;
}

/** Cheap token-overlap check, so a fuzzy match does not overwrite a good guess with the wrong paper. */
function titleSimilarity(a, b) {
  const norm = s => new Set(String(s).toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length > 2));
  const A = norm(a), B = norm(b);
  if (!A.size || !B.size) return 0;
  let hits = 0;
  for (const w of A) if (B.has(w)) hits++;
  return hits / Math.max(A.size, B.size);
}

async function fromArxiv(id, fetchImpl) {
  const res = await fetchImpl(`https://export.arxiv.org/api/query?id_list=${encodeURIComponent(id)}`)
    .catch(() => { throw new LookupError("Could not reach export.arxiv.org", "network"); });
  if (!res.ok) throw new LookupError(`arXiv returned ${res.status}`, "http");
  const xml = await res.text();
  const entry = xml.split("<entry>")[1];
  if (!entry) return null;
  const tag = (t) => (entry.match(new RegExp(`<${t}>([\\s\\S]*?)</${t}>`)) || [])[1];
  const unesc = s => String(s || "").replace(/\s+/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").trim();
  const authors = [...entry.matchAll(/<name>([\s\S]*?)<\/name>/g)].map(m => unesc(m[1]));
  const published = tag("published") || "";
  return {
    title: cleanTitle(unesc(tag("title"))),
    authors,
    year: Number(published.slice(0, 4)) || null,
    venue: "arXiv:" + id,
    kind: "paper",
    doi: unesc(tag("arxiv:doi")) || null,
    url: `https://arxiv.org/abs/${id}`,
    abstract: unesc(tag("summary")),
  };
}

async function fromOpenLibrary(isbn, fetchImpl) {
  const j = await getJson(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`, fetchImpl);
  const b = j[`ISBN:${isbn}`];
  if (!b) return null;
  return {
    title: cleanTitle(b.title + (b.subtitle ? ": " + b.subtitle : "")),
    authors: (b.authors || []).map(a => a.name),
    year: Number(String(b.publish_date || "").match(/\d{4}/)?.[0]) || null,
    venue: (b.publishers || []).map(p => p.name).join(", "),
    kind: "book",
    url: b.url || null,
    cover: b.cover?.medium || null,
  };
}

/**
 * Publisher landing pages carry Google Scholar's citation_* meta tags. When a URL is
 * reachable this is often better than anything in the PDF itself.
 */
function parseCitationMeta(html) {
  const meta = {};
  const re = /<meta[^>]+>/gi;
  for (const tag of html.match(re) || []) {
    const name = (tag.match(/(?:name|property)\s*=\s*["']([^"']+)["']/i) || [])[1];
    const content = (tag.match(/content\s*=\s*["']([^"']*)["']/i) || [])[1];
    if (!name || content == null) continue;
    const k = name.toLowerCase();
    if (k === "citation_author" || k === "dc.creator") (meta.authors ||= []).push(content.trim());
    else if (!meta[k]) meta[k] = content.trim();
  }
  const decode = s => String(s || "").replace(/&amp;/g, "&").replace(/&#(\d+);/g, (_, d) => String.fromCharCode(d)).replace(/&quot;/g, '"');
  const title = decode(meta.citation_title || meta["dc.title"] || meta["og:title"]);
  if (!title) return null;
  const authors = (meta.authors || []).map(decode).flatMap(a =>
    a.includes(",") && a.split(",").length === 2 ? [a.split(",").map(s => s.trim()).reverse().join(" ")] : [a]
  );
  return {
    title: cleanTitle(title),
    authors,
    year: Number(String(meta.citation_publication_date || meta.citation_date || "").match(/\d{4}/)?.[0]) || null,
    venue: decode(meta.citation_journal_title || meta.citation_inbook_title || meta["og:site_name"] || ""),
    kind: meta.citation_isbn ? "book" : "paper",
    doi: meta.citation_doi || null,
  };
}

/* ------------------------------------------------------------------ the ladder */

const PDF_HOST_HINTS = /arxiv\.org|biorxiv\.org|ncbi\.nlm\.nih\.gov|semanticscholar\.org|doi\.org/i;

/**
 * Resolve anything the user gave us into bibliographic fields.
 *
 * @param input  a string (URL / DOI / arXiv id / ISBN / free text) OR
 *               { file: {name, arrayBuffer()} } for a dropped PDF
 * @param deps   { fetch, getDocument, readPdf, onStep }
 *               getDocument is pdf.js; readPdf overrides PDF reading wholesale
 */
async function resolveSource(input, deps = {}) {
  const fetchImpl = deps.fetch || (typeof fetch !== "undefined" ? fetch : null);
  const provenance = [];
  const note = m => { provenance.push(m); deps.onStep?.(m); };

  const isFile = input && typeof input === "object" && input.file;
  const text = isFile ? (input.file.name || "") : String(input || "").trim();

  const fail = (extra = {}) => ({
    title: null, authors: [], year: null, venue: "", kind: "paper",
    doi: null, url: /^https?:/i.test(text) ? text : null,
    confidence: "failed", needsReview: true, provenance, ...extra,
  });

  const settle = (meta, confidence) => ({
    year: null, venue: "", kind: "paper", doi: null, url: null,
    ...meta,
    title: meta.title || null,
    authors: meta.authors || [],
    confidence,
    needsReview: confidence === "guess" || confidence === "failed" || !meta.authors?.length,
    provenance,
  });

  /* --- step 1: identifiers in the string itself. No download, no CORS, no guessing. --- */
  const ids = parseIdentifiers(text);
  if (!isFile) {
    const viaId = await lookupIds(ids, fetchImpl, note);
    if (viaId) return settle(viaId, "confirmed");
  }

  /* --- step 2: get PDF bytes, either from the drop or from the link --- */
  let bytes = null, fetchProblem = null;
  if (isFile) {
    bytes = new Uint8Array(await input.file.arrayBuffer());
    note(`Read ${input.file.name}`);
  } else if (/^https?:/i.test(text) && (/\.pdf($|[?#])/i.test(text) || PDF_HOST_HINTS.test(text))) {
    try {
      const res = await fetchImpl(text);
      if (!res.ok) throw new LookupError(`${res.status}`, "http");
      const ct = res.headers?.get?.("content-type") || "";
      const buf = new Uint8Array(await res.arrayBuffer());
      if (/pdf/i.test(ct) || (buf[0] === 0x25 && buf[1] === 0x50)) {   // %P
        bytes = buf;
        note("Downloaded the PDF");
      } else {
        // it was an HTML landing page after all — Scholar meta tags are right there
        const html = new TextDecoder().decode(buf);
        const meta = parseCitationMeta(html);
        if (meta?.title) {
          note("Read citation metadata from the page");
          if (meta.doi && fetchImpl) {
            const better = await fromCrossref(meta.doi, fetchImpl).catch(() => null);
            if (better) { note(`Confirmed via Crossref (${meta.doi})`); return settle(better, "confirmed"); }
          }
          return settle(meta, meta.authors.length ? "likely" : "guess");
        }
      }
    } catch (e) {
      fetchProblem = e.code === "http"
        ? `That link returned an error (${e.message}).`
        : "That site will not let a browser read the file directly (CORS). Drag the PDF in instead.";
      note(fetchProblem);
    }
  }

  /* --- step 3: read the PDF --- */
  if (bytes && (deps.getDocument || deps.readPdf)) {
    let pdf = null;
    try {
      pdf = deps.readPdf
        ? await deps.readPdf(bytes)
        : await readPdf(bytes, { getDocument: deps.getDocument });
    } catch (e) {
      note(`That file could not be opened as a PDF (${e.message}).`);
      return fail();
    }

    if (!pdf.text.replace(/\s/g, "")) {
      note("No text layer — this looks like a scan. Needs a title typed in, or OCR.");
      return fail({ kind: guessKindFromName(text) });
    }

    // 3a. an identifier printed in the document beats everything else
    const inDoc = parseIdentifiers(pdf.text);
    const viaDoc = await lookupIds(inDoc, fetchImpl, note, "found in the document");
    if (viaDoc) return settle(viaDoc, "confirmed");

    // 3b. embedded metadata, but only if it is not a build artefact
    const embTitle = pdf.xmp.title || pdf.info.Title;
    const embAuthor = pdf.xmp.creator || pdf.info.Author;
    let best = null, fromLayout = false;
    if (!isJunkTitle(embTitle)) {
      const authors = parseAuthorLine(embAuthor);
      note(`Used the PDF's own metadata${authors.length ? "" : " (no author recorded)"}`);
      best = { title: cleanTitle(embTitle), authors, kind: "paper" };
    }

    // 3c. read the page like a person does
    if (!best || !best.authors.length) {
      const guess = guessFromLayout(pdf.pages[0]);
      if (guess.title) {
        note("Read the title and byline off page 1");
        fromLayout = true;
        best = {
          title: best?.title || guess.title,
          authors: best?.authors?.length ? best.authors : guess.authors,
          venue: guess.venue || "",
          year: guess.year,
          kind: guess.kind,
        };
      }
    }

    if (best?.title) {
      // 3d. ask Crossref whether that paper exists, to upgrade a guess into a fact
      if (fetchImpl) {
        const confirmed = await confirmByTitle(best.title, best.authors, fetchImpl).catch(() => null);
        if (confirmed) {
          note(`Matched to Crossref (${confirmed.doi})`);
          return settle(confirmed, "confirmed");
        }
      }
      // ink on a page is a guess and gets checked; the file's own metadata is not
      return settle(best, !best.authors.length || fromLayout ? "guess" : "likely");
    }
    note("Could not find a title on page 1");
    return fail();
  }

  if (bytes && !deps.getDocument && !deps.readPdf) {
    note("PDF reading is not available here");
    return fail();
  }

  /* --- step 4: a plain web page --- */
  if (/^https?:/i.test(text) && fetchImpl && !fetchProblem) {
    try {
      const res = await fetchImpl(text);
      const html = await res.text();
      const meta = parseCitationMeta(html);
      if (meta?.title) {
        note("Read the page's citation metadata");
        if (meta.doi) {
          const better = await fromCrossref(meta.doi, fetchImpl).catch(() => null);
          if (better) { note(`Confirmed via Crossref (${meta.doi})`); return settle(better, "confirmed"); }
        }
        return settle(meta, meta.authors.length ? "likely" : "guess");
      }
    } catch {
      note("That page could not be read from the browser (CORS).");
    }
  }

  /* --- step 5: treat free text as a title and ask Crossref --- */
  if (!/^https?:/i.test(text) && text.length > 8 && fetchImpl) {
    const found = await confirmByTitle(text, null, fetchImpl).catch(() => null);
    if (found) { note("Matched by title on Crossref"); return settle(found, "confirmed"); }
  }

  return fail();
}

async function lookupIds(ids, fetchImpl, note, where = "") {
  if (!fetchImpl) return null;
  const suffix = where ? ` ${where}` : "";
  if (ids.arxiv) {
    const m = await fromArxiv(ids.arxiv, fetchImpl).catch(e => { note(e.message); return null; });
    if (m) { note(`arXiv:${ids.arxiv}${suffix} → arXiv API`); return m; }
  }
  if (ids.doi) {
    const m = await fromCrossref(ids.doi, fetchImpl).catch(e => { note(e.message); return null; });
    if (m) { note(`DOI ${ids.doi}${suffix} → Crossref`); return m; }
  }
  if (ids.isbn) {
    const m = await fromOpenLibrary(ids.isbn, fetchImpl).catch(e => { note(e.message); return null; });
    if (m) { note(`ISBN ${ids.isbn}${suffix} → Open Library`); return m; }
  }
  return null;
}

function guessKindFromName(name) {
  return /book|scan|chapter/i.test(name) ? "book" : "paper";
}

const TONE = {thesis:"var(--s1)", case:"var(--s2)", concept:"var(--s3)", counter:"var(--s4)", quote:"var(--s5)"};

function cover(r, extra=""){
  const surname = (r.authors[0] || r.title || "?").split(" ").slice(-1)[0];
  const mono = esc(surname[0] || "?");
  const n = r.cards.length;
  return `<div class="cover cover--${r.kind} ${extra}" style="--h:${r.h}">
    <span class="cover__kind">${KIND[r.kind]}</span>
    ${n?`<span class="cover__cards">${n} ${n===1?"card":"cards"}</span>`:""}
    <span class="cover__mono">${mono}</span>
    <span class="cover__v">${esc(r.venue)}</span>
  </div>`;
}

/* ==================== chrome ==================== */
function renderRail(){
  $$("#nav .nav__item").forEach(b=>b.setAttribute("aria-current", String(b.dataset.go===state.view)));
  $("#libcount").textContent = readings.length;
  $("#ideanav").innerHTML = ideas.map(i=>{
    const st = stageOf(i.stage), rs = byIdea(i.id);
    const read = rs.filter(r=>r.status==="read").length;
    return `<button class="ideanav__item" data-idea="${i.id}" style="--stage:${st.c}"
      aria-current="${state.view==='idea' && state.idea===i.id}">
      <span class="ideanav__bar"></span>
      <span><span class="ideanav__t">${esc(i.title)}</span>
      <span class="ideanav__m">${st.label} · ${read}/${rs.length} read</span></span>
    </button>`;
  }).join("");
}

function renderTopbar(){
  const t = $("#topbar");
  if(state.view!=="idea"){
    const titles = {cockpit:["Cockpit","Everything on the bench"], library:["Library","Every source, across every idea"], notes:["Why it works this way","Design notes & alternatives"]};
    const [a,b] = titles[state.view];
    t.style.removeProperty("--stage");
    t.innerHTML = `<div class="crumb"><span class="crumb__t">${a}</span>
      <span class="lbl" style="margin-left:4px">${b}</span></div>`;
    return;
  }
  const idea = ideas.find(i=>i.id===state.idea), st = stageOf(idea.stage);
  const rs = byIdea(idea.id), cs = cardsOf(idea.id);
  t.style.setProperty("--stage", st.c);
  t.innerHTML = `
    <div class="crumb">
      <span class="crumb__t">${esc(idea.title)}</span>
      <span class="crumb__stage">${st.label}</span>
    </div>
    <div class="tabs">
      <button class="tab" data-tab="brief"   aria-current="${state.tab==='brief'}">Brief</button>
      <button class="tab" data-tab="reading" aria-current="${state.tab==='reading'}">Reading<span class="tab__n">${rs.length}</span></button>
      <button class="tab" data-tab="draft"   aria-current="${state.tab==='draft'}">Draft<span class="tab__n">${words(drafts[idea.id]||"")}w</span></button>
    </div>
    <div class="topbar__right">
      <span class="lbl">${cs.filter(c=>c.used).length}/${cs.length} cards used</span>
    </div>`;
}

/* ==================== cockpit ==================== */
function viewCockpit(){
  const totalCards = readings.reduce((n,r)=>n+r.cards.length,0);
  const readN = readings.filter(r=>r.status==="read").length;
  const draftW = Object.values(drafts).reduce((n,d)=>n+words(d),0);
  const counts = STAGES.map(s=>ideas.filter(i=>i.stage===s.id).length);

  return `
  <div class="hero">
    <div>
      <h1>Four ideas on the bench.</h1>
      <p>Two are warm. <b>The Cost of Legibility</b> has been in drafting for nine days and has five unspent cards — that is the one to sit down with.</p>
    </div>
    <div class="gauges">
      <div class="gauge"><span class="gauge__n">${ideas.length}</span><span class="gauge__l">Ideas</span></div>
      <div class="gauge"><span class="gauge__n">${readN}<span style="color:var(--faint)">/${readings.length}</span></span><span class="gauge__l">Read</span></div>
      <div class="gauge"><span class="gauge__n">${totalCards}</span><span class="gauge__l">Cards</span></div>
      <div class="gauge"><span class="gauge__n">${(draftW/1000).toFixed(1)}k</span><span class="gauge__l">Words</span></div>
    </div>
  </div>

  <div class="pipeline">
    ${STAGES.map((s,i)=>`<div class="pipeline__seg" style="--stage:${s.c}">
      <div class="pipeline__l">${s.label}</div><div class="pipeline__n">${counts[i]}</div></div>`).join("")}
  </div>

  <div class="ideas">
    ${ideas.map(i=>{
      const st = stageOf(i.stage), k = stageIdx(i.stage);
      const rs = byIdea(i.id), cs = cardsOf(i.id);
      const w = words(drafts[i.id]||"");
      return `<button class="idea" data-idea="${i.id}" style="--stage:${st.c}">
        <span class="idea__ramp">${STAGES.map((sg,j)=>`<i style="${j<=k?"background:"+sg.c:""}"></i>`).join("")}</span>
        <span class="idea__body">
          <span class="idea__top"><span class="idea__title">${esc(i.title)}</span></span>
          <span class="idea__blurb">${esc(i.blurb)}</span>
          <span class="idea__stats">
            <span class="stat"><span class="stat__n">${rs.filter(r=>r.status==="read").length}/${rs.length}</span><span class="stat__l">Read</span></span>
            <span class="stat"><span class="stat__n">${cs.length}</span><span class="stat__l">Cards</span></span>
            <span class="stat"><span class="stat__n">${cs.filter(c=>!c.used).length}</span><span class="stat__l">Unspent</span></span>
            <span class="stat"><span class="stat__n">${w?w.toLocaleString():"—"}</span><span class="stat__l">Words</span></span>
          </span>
        </span>
        <span class="idea__next"><b>Next</b> ${esc(i.next)}</span>
      </button>`;
    }).join("")}
  </div>`;
}

/* ==================== idea: brief ==================== */

/* ==================== idea: reading ==================== */
function viewReading(){
  const i = ideas.find(x=>x.id===state.idea), st = stageOf(i.stage);
  let rs = byIdea(i.id);
  if(state.filter==="review") rs = rs.filter(r=>r.needsReview);
  else if(state.filter!=="all") rs = rs.filter(r=>r.status===state.filter);
  const all = byIdea(i.id);
  const f = s => all.filter(r=>r.status===s).length;
  return `<div style="--stage:${st.c}">
    <div class="capture">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="var(--muted)" stroke-width="1.5" style="flex:none"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-1 1"/><path d="M11.5 8.5a3 3 0 0 0-4.2 0l-2.6 2.6a3 3 0 0 0 4.2 4.2l1-1"/></svg>
      <input class="capture__in" id="capture" placeholder="Paste a link, DOI, arXiv ID, or ISBN — or drop a PDF here" autocomplete="off">
      <span class="capture__hint">↵ to add</span>
    </div>
    <div class="capture__samples">
      <span class="lbl">Try:</span>
      ${SAMPLES.map((x,n)=>`<button class="sample" data-sample="${n}">${esc(x.label)}</button>`).join("")}
      ${LIVE?"":`<span class="lbl" style="margin-left:auto">Replaying recorded lookups — this preview has no network</span>`}
    </div>

    <div class="filters">
      <button class="filter" data-filter="all"     aria-pressed="${state.filter==='all'}">All <span class="mono" style="color:var(--faint)">${all.length}</span></button>
      <button class="filter" data-filter="reading" aria-pressed="${state.filter==='reading'}">Reading <span class="mono" style="color:var(--faint)">${f("reading")}</span></button>
      <button class="filter" data-filter="read"    aria-pressed="${state.filter==='read'}">Read <span class="mono" style="color:var(--faint)">${f("read")}</span></button>
      <button class="filter" data-filter="queued"  aria-pressed="${state.filter==='queued'}">Queue <span class="mono" style="color:var(--faint)">${f("queued")}</span></button>
      ${all.some(r=>r.needsReview)?`<button class="filter" data-filter="review" aria-pressed="${state.filter==='review'}" style="color:var(--warn)">Needs check <span class="mono">${all.filter(r=>r.needsReview).length}</span></button>`:""}
      <span style="margin-left:auto" class="lbl">Sorted by when you last touched it</span>
    </div>

    <div class="tiles" id="tiles">
      ${rs.map(r=>`<button class="tile ${r.needsReview?"tile--review":""}" data-reading="${r.id}">
        ${cover(r)}
        <span class="tile__cap">
          <span class="tile__t">${esc(r.title)}</span>
          <span class="tile__a" style="display:block; margin-top:3px">${captionAuthors(r.authors)} · ${r.year||"n.d."}</span>
        </span>
        <span class="tile__foot">
          ${r.needsReview
            ? `<span class="chip chip--check">Check</span>`
            : `<span class="chip chip--${r.status}">${r.status==="read"?"Read":r.status==="reading"?"Reading":"Queued"}</span>`}
          <span class="tile__note ${r.summary?"tile__note--has":""}">${r.summary?"notes ✓":"no notes"}</span>
        </span>
      </button>`).join("")}
    </div>
  </div>`;
}

/* ==================== reading detail ==================== */
function viewNote(){
  const r = readings.find(x=>x.id===state.reading);

  const why = {
    failed:"Nothing in the file said what this is — no DOI, no usable metadata, and no text on page 1.",
    guess:"This was read off the page rather than confirmed against a registry, so check it.",
    likely:"Found in the document itself, but no registry confirmed it.",
  }[r.confidence];
  return `<div style="--stage:${st.c}">
  <button class="note__back" data-back>← ${esc(i.title)} / Reading</button>
  <div class="note">
    <div>
      ${r.needsReview?`<div class="review">
        <div class="review__h"><h3>Worth a second look</h3></div>

        <div class="review__grid">

          <label class="wide"><span>Authors</span><input id="rv-authors" value="${esc(r.authors.join(", "))}" placeholder="Separated by commas"></label>
          <label><span>Year</span><input id="rv-year" value="${esc(r.year||"")}"></label>

      </div>

          <a href="#"><svg viewBox="0 0 20 20"><path d="M6 3h8l3 3v11H6z"/><path d="M10 8v6M7.5 11.5 10 14l2.5-2.5"/></svg> ${r.kind==="book"?"Local scan.pdf":"PDF in library"}</a>

/* ==================== idea: draft ==================== */
function viewDraft(){
  const i = ideas.find(x=>x.id===state.idea), st = stageOf(i.stage);
  const all = cardsOf(i.id);
  let cs = all;
  if(state.q) cs = all.filter(c=>(c.q+c.src.title).toLowerCase().includes(state.q.toLowerCase()));
  cs = [...cs].sort((a,b)=>Number(a.used)-Number(b.used));
  const w = words(drafts[i.id]||""), target = (i.essay&&i.essay.target)||4000;
  return `<div class="draft ${state.focus?"draft--focus":""}" style="--stage:${st.c}">
    <div class="paper">
      <div class="paper__eyebrow">Script · draft 3 · autosaved 2 min ago</div>
      <h1>${esc(i.title)}</h1>
      ${i.essay&&i.essay.deck?`<p class="paper__deck">${esc(i.essay.deck)}</p>`:""}
      <div class="prose" id="prose" contenteditable="true">${drafts[i.id]||"<p>Start anywhere. The first paragraph is always wrong.</p>"}</div>
    </div>
    <aside class="rail2">
      <div class="rail2__head">
        <h3>Evidence</h3>
        <span class="rail2__meter">${all.filter(c=>c.used).length}/${all.length} spent</span>
      </div>
      <input class="rail2__search" id="cardsearch" placeholder="Search your cards…" value="${esc(state.q)}">
      <div class="rail2__list">
        ${ecards(cs, all)}
      </div>
      <div>
        <div class="wordbar">
          <span class="mono" style="font-size:11px; color:var(--muted)">${w.toLocaleString()} / ${target.toLocaleString()}</span>
          <span class="wordbar__track"><span class="wordbar__fill" style="width:${Math.min(100,w/target*100)}%"></span></span>
          <span class="mono" style="font-size:11px; color:var(--faint)">${Math.round(w/150)} min read</span>
        </div>
      </div>
    </aside>
  </div>`;
}

function ecards(cs, all){
  if(!cs.length) return `<p class="lbl" style="padding:10px 2px">No cards match.</p>`;
  return cs.map(c=>`<button class="ecard ${c.used?"ecard--used":""}" data-card="${all.indexOf(c)}"
      style="--tone:${TONE[c.tag]||"var(--accent)"}">
    <span class="ecard__q">${esc(c.q)}</span>
    <span class="ecard__s">
      <span>${esc(authorLine(c.src.authors))} ${c.src.year}</span>
      <span style="color:var(--tone)">${c.tag}</span>
      <span style="margin-left:auto" class="${c.used?"ecard__used":""}">${c.used?"✓ used":"insert →"}</span>
    </span>
  </button>`).join("");
}

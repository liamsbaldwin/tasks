<title>Marginalia Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400..700;1,400..600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --ground:#E9EBEE; --surface:#FAFBFC; --surface-2:#F1F3F6; --surface-3:#E3E7EC;
  --ink:#14181D; --ink-2:#3D454F; --muted:#6E7884; --faint:#98A2AE;
  --line:#D5DAE1; --line-soft:#E4E8ED;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --accent-soft:rgba(43,76,126,.10);
  --s1:#4A5BAA; --s2:#2C7FA0; --s3:#A97C24; --s4:#BC5F2C; --s5:#9A382F;
  --good:#3F7D53; --warn:#A97C24;
  --cover-s:30%; --cover-l:87%; --cover-ink-l:26%; --cover-rule:.55;
  --shadow:0 1px 2px rgba(20,24,29,.05), 0 8px 24px -12px rgba(20,24,29,.18);
  --shadow-lift:0 2px 4px rgba(20,24,29,.06), 0 18px 40px -18px rgba(20,24,29,.30);
  --sans:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Faustina", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101317; --surface:#181C21; --surface-2:#1F242A; --surface-3:#272D35;
    --ink:#E9ECF0; --ink-2:#B8C0CA; --muted:#8A94A1; --faint:#6C7683;
    --line:#2C333B; --line-soft:#232930;
    --accent:#84AAD9; --accent-ink:#0F1317; --accent-soft:rgba(132,170,217,.15);
    --s1:#8590E0; --s2:#4FAAC9; --s3:#D2A241; --s4:#E08351; --s5:#D2695E;
    --good:#6FB187; --warn:#D2A241;
    --cover-s:24%; --cover-l:23%; --cover-ink-l:82%; --cover-rule:.30;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ground:#101317; --surface:#181C21; --surface-2:#1F242A; --surface-3:#272D35;
  --ink:#E9ECF0; --ink-2:#B8C0CA; --muted:#8A94A1; --faint:#6C7683;
  --line:#2C333B; --line-soft:#232930;
  --accent:#84AAD9; --accent-ink:#0F1317; --accent-soft:rgba(132,170,217,.15);
  --s1:#8590E0; --s2:#4FAAC9; --s3:#D2A241; --s4:#E08351; --s5:#D2695E;
  --good:#6FB187; --warn:#D2A241;
  --cover-s:24%; --cover-l:23%; --cover-ink-l:82%; --cover-rule:.30;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.75);
}

/* ============ base ============ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-family:var(--serif); font-weight:600; text-wrap:balance; letter-spacing:-.005em}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.lbl{
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--faint);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ shell ============ */
.app{display:grid; grid-template-columns:258px minmax(0,1fr); min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:6px; padding:18px 0 14px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:baseline; gap:8px; padding:0 18px 14px}
.brand__mark{
  font-family:var(--serif); font-size:23px; font-weight:700; letter-spacing:-.02em;
}
.brand__dot{width:7px;height:7px;border-radius:50%;background:var(--s3);transform:translateY(-3px)}
.brand__sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase}

.nav{display:flex; flex-direction:column; gap:1px; padding:0 10px}
.nav__item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border-radius:7px; color:var(--ink-2); font-size:14px;
}
.nav__item:hover{background:var(--surface-2)}
.nav__item[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:500}
.nav__ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav__count{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint)}

.rail__head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 19px 7px; margin-top:8px; border-top:1px solid var(--line-soft);
}
.rail__add{
  width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted); font-size:15px; line-height:1;
}
.rail__add:hover{background:var(--surface-2); color:var(--ink)}

.ideanav{display:flex; flex-direction:column; gap:1px; padding:0 10px}
.ideanav__item{
  display:grid; grid-template-columns:3px 1fr; gap:9px; width:100%; text-align:left;
  padding:7px 9px 7px 7px; border-radius:7px; align-items:center;
}
.ideanav__item:hover{background:var(--surface-2)}
.ideanav__item[aria-current="true"]{background:var(--surface-2)}
.ideanav__bar{height:calc(100% - 2px); min-height:26px; border-radius:2px; background:var(--stage)}
.ideanav__t{font-size:13.5px; line-height:1.35; color:var(--ink-2)}
.ideanav__item[aria-current="true"] .ideanav__t{color:var(--ink); font-weight:500}
.ideanav__m{display:block; font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:3px}

.rail__foot{margin-top:auto; padding:14px 18px 0; border-top:1px solid var(--line-soft); display:flex; align-items:center; gap:10px}
.themebtn{
  display:flex;align-items:center;gap:7px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:4px 7px; border-radius:6px;
}
.themebtn:hover{background:var(--surface-2); color:var(--ink-2)}

/* ============ stage / topbar ============ */
.stage{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:0 30px; display:flex; align-items:flex-end; gap:22px; min-height:56px;
}
.crumb{display:flex; align-items:center; gap:9px; padding-bottom:13px; align-self:center}
.crumb__t{font-family:var(--serif); font-size:17px; font-weight:600}
.crumb__stage{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--stage); border:1px solid color-mix(in srgb, var(--stage) 40%, transparent);
  background:color-mix(in srgb, var(--stage) 11%, transparent);
  padding:2px 7px; border-radius:20px;
}
.tabs{display:flex; gap:2px; align-self:flex-end}
.tab{
  padding:9px 13px 11px; font-size:13.5px; color:var(--muted);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-current="true"]{color:var(--ink); border-bottom-color:var(--stage,var(--accent)); font-weight:500}
.tab__n{font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-left:5px}
.topbar__right{margin-left:auto; align-self:center; padding-bottom:13px; display:flex; gap:8px; align-items:center}

.view{padding:30px; max-width:1320px; width:100%}
.view--wide{max-width:none}

/* ============ generic bits ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:7px;
  border:1px solid var(--line); background:var(--surface); font-size:13px; color:var(--ink-2);
  box-shadow:0 1px 1px rgba(20,24,29,.03);
}
.btn:hover{background:var(--surface-2); color:var(--ink)}
.btn--primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:500}
.btn--primary:hover{background:var(--accent); filter:brightness(1.08); color:var(--accent-ink)}
.btn--ghost{border-color:transparent; background:none}
.btn--ghost:hover{background:var(--surface-2)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.chip{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  padding:2.5px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); white-space:nowrap;
}
.chip--read{color:var(--good); border-color:color-mix(in srgb, var(--good) 38%, transparent); background:color-mix(in srgb, var(--good) 10%, transparent)}
.chip--reading{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); background:color-mix(in srgb, var(--warn) 10%, transparent)}
.chip--queued{color:var(--faint)}

/* ============ cockpit ============ */
.hero{display:flex; align-items:flex-end; justify-content:space-between; gap:30px; margin-bottom:24px}
.hero h1{font-size:30px; line-height:1.15}
.hero p{color:var(--muted); font-size:14.5px; margin-top:7px; max-width:56ch}
.gauges{display:flex; gap:0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.gauge{padding:11px 18px; border-right:1px solid var(--line-soft); min-width:92px}
.gauge:last-child{border-right:0}
.gauge__n{font-family:var(--mono); font-size:21px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; display:block; line-height:1.1}
.gauge__l{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-top:3px; display:block}

.pipeline{display:flex; gap:0; align-items:stretch; margin:0 0 26px; border-radius:var(--r); overflow:hidden; border:1px solid var(--line)}
.pipeline__seg{flex:1; padding:9px 12px; background:var(--surface); border-right:1px solid var(--line-soft); position:relative}
.pipeline__seg:last-child{border-right:0}
.pipeline__seg::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--stage)}
.pipeline__l{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--stage)}
.pipeline__n{font-family:var(--mono); font-size:17px; color:var(--ink-2); margin-top:2px}

.ideas{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px}
.idea{
  display:flex; flex-direction:column; text-align:left; padding:0; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); transition:transform .16s ease, box-shadow .16s ease;
}
.idea:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.idea__ramp{display:flex; height:4px}
.idea__ramp i{flex:1; background:var(--line-soft)}
.idea__body{padding:16px 18px 14px; flex:1; display:flex; flex-direction:column; gap:9px}
.idea__top{display:flex; align-items:center; gap:8px}
.idea__title{font-size:19px; line-height:1.25}
.idea__blurb{color:var(--muted); font-family:var(--serif); font-size:15px; line-height:1.55}
.idea__stats{display:flex; gap:14px; margin-top:auto; padding-top:11px; border-top:1px solid var(--line-soft)}
.stat{display:flex; flex-direction:column; gap:1px}
.stat__n{font-family:var(--mono); font-size:13px; color:var(--ink-2)}
.stat__l{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.idea__next{
  display:flex; align-items:center; gap:8px; padding:9px 18px;
  background:var(--surface-2); border-top:1px solid var(--line-soft);
  font-size:12.5px; color:var(--ink-2);
}
.idea__next b{font-weight:500; color:var(--stage)}

/* ============ reading grid ============ */
.capture{
  display:flex; gap:10px; align-items:center; padding:10px 12px; margin-bottom:20px;
  background:var(--surface); border:1px dashed var(--line); border-radius:var(--r);
}
.capture:focus-within{border-color:var(--accent); border-style:solid; box-shadow:0 0 0 3px var(--accent-soft)}
.capture__in{
  flex:1; border:0; background:none; outline:none; font-size:14px; padding:4px 2px; min-width:0;
}
.capture__in::placeholder{color:var(--faint)}
.capture__hint{font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.05em; white-space:nowrap}

.filters{display:flex; gap:6px; align-items:center; margin-bottom:16px; flex-wrap:wrap}
.filter{padding:4px 10px; border-radius:20px; font-size:12.5px; color:var(--muted); border:1px solid transparent}
.filter:hover{background:var(--surface-2)}
.filter[aria-pressed="true"]{background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow)}

.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:18px}
.tile{
  display:flex; flex-direction:column; gap:9px; text-align:left; padding:0;
  transition:transform .16s ease;
}
.tile:hover{transform:translateY(-3px)}
.tile__cap{flex:1}
.tile__t{display:block; font-family:var(--serif); font-size:15px; line-height:1.3; font-weight:600}
.tile:hover .tile__t{color:var(--accent)}
.tile__a{font-size:12px; color:var(--muted); line-height:1.35}
.tile__foot{display:flex; align-items:center; gap:6px; margin-top:1px}
.tile__note{
  font-family:var(--mono); font-size:10px; color:var(--faint);
  display:inline-flex; align-items:center; gap:3px; margin-left:auto;
}
.tile__note--has{color:var(--accent)}

/* generated covers — deterministic art, since papers have no jacket */
.cover{
  position:relative; aspect-ratio:3/4; border-radius:6px; overflow:hidden;
  background:hsl(var(--h) var(--cover-s) var(--cover-l));
  box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:flex-end;
  padding:10px 10px 11px; isolation:isolate;
}
.tile:hover .cover{box-shadow:var(--shadow-lift)}
.cover__kind{
  position:absolute; top:9px; left:10px; z-index:2;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.13em; text-transform:uppercase;
  color:hsl(var(--h) 30% var(--cover-ink-l)); opacity:.62;
}
.cover__mono{
  position:absolute; left:6px; bottom:22%; z-index:1;
  font-family:var(--serif); font-size:82px; font-weight:700; line-height:.72;
  color:hsl(var(--h) 45% var(--cover-ink-l)); opacity:.17; pointer-events:none;
}
.cover__v{
  position:relative; z-index:2; font-family:var(--mono); font-size:9px; line-height:1.35;
  color:hsl(var(--h) 32% var(--cover-ink-l)); opacity:.8;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.cover__cards{
  position:absolute; top:8px; right:9px; z-index:3; font-family:var(--mono); font-size:9px;
  background:hsl(var(--h) 40% var(--cover-ink-l)); color:hsl(var(--h) var(--cover-s) var(--cover-l));
  border-radius:20px; padding:1px 6px; opacity:.9;
}
/* form tells you the kind at a glance */
.cover--paper::before{           /* ruled column of text */
  content:""; position:absolute; left:10px; right:10px; top:26px; height:46%; z-index:1;
  background:repeating-linear-gradient(to bottom,
    hsl(var(--h) 35% var(--cover-ink-l) / var(--cover-rule)) 0 1px, transparent 1px 6px);
  -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);
  mask-image:linear-gradient(to bottom,#000 55%,transparent);
}
.cover--book::before{            /* a spine */
  content:""; position:absolute; inset:0 auto 0 0; width:12px; z-index:2;
  background:hsl(var(--h) 42% calc(var(--cover-l) - 9%));
  border-right:1px solid hsl(var(--h) 35% var(--cover-ink-l) / .18);
}
.cover--book{padding-left:21px}
.cover--book .cover__kind{left:21px}
.cover--book .cover__mono{left:16px}
.cover--essay::before{           /* a printed rule, as a magazine page */
  content:""; position:absolute; left:10px; right:10px; top:26px; height:3px; z-index:1;
  border-top:1px solid hsl(var(--h) 35% var(--cover-ink-l) / .5);
  border-bottom:1px solid hsl(var(--h) 35% var(--cover-ink-l) / .5);
}
.cover--talk::before{            /* a play button */
  content:""; position:absolute; top:30px; right:12px; width:24px; height:24px; border-radius:50%; z-index:2;
  border:2px solid hsl(var(--h) 40% var(--cover-ink-l) / .38);
}
.cover--talk::after{
  content:""; position:absolute; top:39px; right:20px; z-index:2;
  border-left:8px solid hsl(var(--h) 40% var(--cover-ink-l) / .45);
  border-top:5px solid transparent; border-bottom:5px solid transparent;
}
.cover--new{animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.9); opacity:0} to{transform:scale(1); opacity:1}}
.tile--ghost .cover{background:var(--surface-2); box-shadow:none; border:1px solid var(--line)}
.shimmer{
  position:absolute; inset:0; z-index:4;
  background:linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--ink) 8%, transparent) 45%, transparent 70%);
  background-size:250% 100%; animation:sweep 1.05s linear infinite;
}
@keyframes sweep{from{background-position:180% 0} to{background-position:-80% 0}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

/* ============ note panel (reading detail) ============ */
.note{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:34px; align-items:start; max-width:1090px}
.note__back{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:14px}
.note__back:hover{color:var(--ink)}
.note__title{font-size:27px; line-height:1.2}
.note__authors{color:var(--muted); font-size:14px; margin-top:6px}
.note__venue{font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-top:4px}
.field{margin-top:24px}
.field__head{display:flex; align-items:center; gap:9px; margin-bottom:8px}
.field__head h3{font-size:15px}
.field__hint{font-family:var(--mono); font-size:10px; color:var(--faint); margin-left:auto}
.pad{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px; font-family:var(--serif); font-size:16px; line-height:1.65; color:var(--ink);
  min-height:64px; outline:none;
}
.pad:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.pad[data-empty="true"]::before{content:attr(data-ph); color:var(--faint); font-style:italic}
.pad p{margin:0 0 .7em}
.pad p:last-child{margin-bottom:0}

.cards{display:flex; flex-direction:column; gap:9px}
.qcard{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--tone,var(--accent));
  border-radius:0 8px 8px 0; padding:11px 13px;
}
.qcard__q{font-family:var(--serif); font-size:15.5px; line-height:1.55}
.qcard__m{display:flex; align-items:center; gap:9px; margin-top:8px}
.qcard__loc{font-family:var(--mono); font-size:10.5px; color:var(--faint)}
.qcard__tag{font-family:var(--mono); font-size:10px; color:var(--tone); letter-spacing:.05em; text-transform:uppercase}
.qcard__use{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint)}
.qcard__use--used{color:var(--good)}
.addcard{
  border:1px dashed var(--line); border-radius:8px; padding:9px 13px; font-size:13px;
  color:var(--muted); text-align:left; width:100%;
}
.addcard:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

.side{display:flex; flex-direction:column; gap:14px; position:sticky; top:76px}
.side__box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px}
.side__box h4{font-size:13px; margin-bottom:10px}
.kv{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px; border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0; font-family:var(--mono); font-size:12px; text-align:right}
.statusrow{display:flex; gap:5px}
.statusrow .filter{flex:1; text-align:center; font-size:12px}
.linkrow{display:flex; flex-direction:column; gap:6px}

<script>
/* ==================== data ==================== */
const STAGES = [
  {id:"spark",    label:"Spark",     c:"var(--s1)"},
  {id:"gathering",label:"Gathering", c:"var(--s2)"},
  {id:"drafting", label:"Drafting",  c:"var(--s3)"},
  {id:"cutting",  label:"Cutting",   c:"var(--s4)"},
  {id:"published",label:"Published", c:"var(--s5)"}
];
const stageIdx = id => STAGES.findIndex(s=>s.id===id);
const stageOf  = id => STAGES[stageIdx(id)] || STAGES[0];

const ideas = [
  {
    id:"legibility", title:"The Cost of Legibility", stage:"drafting",
    blurb:"Every system that wants to be governed first has to be made readable — and the act of making it readable quietly destroys the thing worth governing. Where does the trade actually bite?",
    next:"Draft section 3 — the metric system as a control experiment",
    essay:{
      deck:"On what standardisation buys, and what it silently spends.",
      target:4000
    }
  },
  {
    id:"forget", title:"Why Interfaces Forget", stage:"gathering",
    blurb:"Software used to remember where you were. Somewhere between the desktop and the feed, interfaces stopped keeping state on your behalf — and we started doing that work by hand.",
    next:"3 papers queued, 0 read — start with Weiser"
  },
  {
    id:"scale", title:"Scaling Laws Outside the Lab", stage:"spark",
    blurb:"Metabolic scaling is beautiful in biology and suspiciously popular everywhere else. When does a power law describe a mechanism, and when is it a coincidence with good PR?",
    next:"Write the 3-sentence brief, then find 5 sources"
  },
  {
    id:"maps", title:"The Map Became the Territory", stage:"published",
    blurb:"Navigation apps did not just describe traffic; they redistributed it. A short piece on measurement instruments that alter what they measure.",
    next:"Shipped 14 Jun — 41k views"
  }
];

const readings = [
  // legibility
  {id:"r1", kind:"book",  title:"Seeing Like a State", authors:["James C. Scott"], year:1998,
   venue:"Yale University Press", ideas:["legibility","maps"], status:"read", h:212,
   summary:"Scott's core move: states can only administer what they can see, so they simplify reality into legible grids — cadastral maps, permanent surnames, standard measures, scientific forestry. The simplification is genuinely useful, but it deletes the local, unwritten knowledge (mētis) that made the original system work. High-modernist failure happens when a state has legibility, an ideology, authoritarian power, and a prostrate civil society all at once.",
   cards:[
     {q:"The legibility of a society provides the capacity for large-scale social engineering; high-modernist ideology provides the desire.", loc:"p. 5", tag:"thesis", used:true},
     {q:"Scientific forestry produced a forest that was easier to count and, within a century, one that was dying.", loc:"p. 20", tag:"case", used:true},
     {q:"Mētis — practical, local knowledge — resists codification precisely because it is context-dependent.", loc:"p. 316", tag:"concept", used:false}
   ]},
  {id:"r2", kind:"book", title:"The Measure of All Things", authors:["Ken Alder"], year:2002,
   venue:"The Free Press", ideas:["legibility"], status:"reading", h:24,
   summary:"The seven-year expedition to measure the meridian and define the metre. Useful as the control case: a standardisation project that mostly worked, and whose surveyors quietly fudged data they could not reconcile.",
   cards:[
     {q:"Delambre preserved the discrepant measurements rather than discard them — the error was archived, not erased.", loc:"ch. 9", tag:"case", used:false},
     {q:"A universal measure was sold as a gift to all peoples and delivered as an instrument of the state.", loc:"ch. 2", tag:"thesis", used:false}
   ]},
  {id:"r3", kind:"essay", title:"The Tyranny of Structurelessness", authors:["Jo Freeman"], year:1972,
   venue:"Berkeley Journal of Sociology", ideas:["legibility"], status:"read", h:340,
   summary:"The inverse argument, and the one that keeps my thesis honest: refusing to make a group legible does not abolish its power structure, it just makes it invisible and unaccountable. Legibility is not only imposed from outside — sometimes it is the only defence the governed have.",
   cards:[
     {q:"There is no such thing as a structureless group. Any group of people will inevitably structure itself in some fashion.", loc:"§1", tag:"counter", used:true},
     {q:"Elites are not conspiracies. They are simply the people who know each other well enough to act together.", loc:"§2", tag:"counter", used:false}
   ]},
  {id:"r4", kind:"book", title:"Standards: Recipes for Reality", authors:["Lawrence Busch"], year:2011,
   venue:"MIT Press", ideas:["legibility"], status:"queued", h:150, summary:"", cards:[]},
  {id:"r5", kind:"paper", title:"Cadastral Maps and the Fiscal Grid", authors:["R. Kain","E. Baigent"], year:1992,
   venue:"The Cadastral Map in the Service of the State", ideas:["legibility"], status:"queued", h:190, summary:"", cards:[]},

  // forget
  {id:"r6", kind:"paper", title:"The Computer for the 21st Century", authors:["Mark Weiser"], year:1991,
   venue:"Scientific American 265(3)", ideas:["forget"], status:"reading", h:196,
   summary:"The disappearing-computer essay. Worth reading against the grain: Weiser wanted machines that faded into the background because they held context for you. What actually shipped fades into the background while holding nothing.",
   cards:[{q:"The most profound technologies are those that disappear. They weave themselves into the fabric of everyday life until they are indistinguishable from it.", loc:"p. 94", tag:"thesis", used:false}]},
  {id:"r7", kind:"essay", title:"As We May Think", authors:["Vannevar Bush"], year:1945,
   venue:"The Atlantic", ideas:["forget","legibility"], status:"queued", h:36, summary:"", cards:[]},
  {id:"r8", kind:"paper", title:"Direct Manipulation: A Step Beyond Programming Languages", authors:["Ben Shneiderman"], year:1983,
   venue:"IEEE Computer 16(8)", ideas:["forget"], status:"queued", h:262, summary:"", cards:[]},
  {id:"r9", kind:"paper", title:"Beyond Being There", authors:["Jim Hollan","Scott Stornetta"], year:1992,
   venue:"CHI '92", ideas:["forget"], status:"queued", h:288, summary:"", cards:[]},

  // scale
  {id:"r10", kind:"paper", title:"A General Model for the Origin of Allometric Scaling Laws in Biology",
   authors:["G. West","J. Brown","B. Enquist"], year:1997, venue:"Science 276", ideas:["scale"], status:"queued", h:8, summary:"", cards:[]},
  {id:"r11", kind:"book", title:"Scale", authors:["Geoffrey West"], year:2017,
   venue:"Penguin Press", ideas:["scale"], status:"queued", h:120, summary:"", cards:[]},
  {id:"r12", kind:"paper", title:"Growth, Innovation, Scaling, and the Pace of Life in Cities",
   authors:["L. Bettencourt","J. Lobo","D. Helbing","C. Kühnert","G. West"], year:2007,
   venue:"PNAS 104(17)", ideas:["scale","maps"], status:"queued", h:172, summary:"", cards:[]},
  {id:"r13", kind:"talk", title:"The Surprising Math of Cities and Corporations", authors:["Geoffrey West"], year:2011,
   venue:"TED", ideas:["scale"], status:"queued", h:96, summary:"", cards:[]}
];

const drafts = {
  legibility:`<h2>1. The forest that was counted to death</h2>
<p>In the late eighteenth century, Prussian and Saxon foresters set out to solve a problem that sounds purely administrative: nobody knew how much timber the crown owned. What followed is the cleanest example I know of a measurement project that changed the thing it measured.</p>
<blockquote>Scientific forestry produced a forest that was easier to count and, within a century, one that was dying.<cite>Scott, <i>Seeing Like a State</i> (1998), p. 20</cite></blockquote>
<p>The order of operations matters. The foresters did not set out to simplify the forest. They set out to <i>see</i> it — and seeing required a unit, and the unit required that everything which was not that unit stop mattering.</p>
<h2>2. What legibility actually buys</h2>
<p>It would be easy, and wrong, to write this as a story about bureaucratic vandalism. Legibility is the precondition for almost everything I would not want to live without: public health statistics, land title that survives the death of the person who remembers the boundary, a currency.</p>
<blockquote>The legibility of a society provides the capacity for large-scale social engineering; high-modernist ideology provides the desire.<cite>Scott, <i>Seeing Like a State</i> (1998), p. 5</cite></blockquote>
<p>So the interesting question is not whether to make things legible. It is which parts of a system are load-bearing precisely <i>because</i> they were never written down — and whether you can tell before you pave them over.</p>
<h2>3. The metric system as a control experiment</h2>
<p><span class="tk">TK</span> — Alder's meridian survey is the case where standardisation mostly worked. Why? Provisional answer: the metre was imposed on a <i>measuring instrument</i>, not on a living practice. Nobody's craft knowledge lived inside the old <i>toise</i>.</p>
<p><span class="tk">TK</span> — then pivot to Freeman: the counter-case where illegibility is the abuse.</p>`,
  forget:`<p><span class="tk">TK</span> — opening image: the browser tab you left open for six weeks because it was the only place your thought was stored.</p>`,
  scale:``,
  maps:`<h2>Instruments that move what they measure</h2><p>Shipped. Full script in the archive.</p>`
};

const state = {
  view:"cockpit", idea:"legibility", tab:"reading", reading:null,
  filter:"all", focus:false, q:""
};

/* ==================== helpers ==================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byIdea = id => readings.filter(r=>r.ideas.includes(id));
const cardsOf = id => byIdea(id).flatMap(r=>r.cards.map(c=>({...c, src:r})));
const words = html => (html.replace(/<[^>]+>/g," ").match(/[A-Za-z0-9'’-]+/g)||[]).length;
const authorLine = a => a.length>2 ? a[0].split(" ").slice(-1)[0]+" et al." : a.map(n=>n.split(" ").slice(-1)[0]).join(" & ");
const KIND = {paper:"Paper", book:"Book", essay:"Essay", talk:"Talk"};
const TONE = {thesis:"var(--s1)", case:"var(--s2)", concept:"var(--s3)", counter:"var(--s4)", quote:"var(--s5)"};

function cover(r, extra=""){
  const mono = esc((r.authors[0].split(" ").slice(-1)[0] || "?")[0]);
  const n = r.cards.length;
  return `<div class="cover cover--${r.kind} ${extra}" style="--h:${r.h}">
    <span class="cover__kind">${KIND[r.kind]}</span>
    ${n?`<span class="cover__cards">${n} ${n===1?"card":"cards"}</span>`:""}
    <span class="cover__mono">${mono}</span>
    <span class="cover__v">${esc(r.venue)}</span>
  </div>`;
}

/* ==================== chrome ==================== */
function renderRail(){
  $$("#nav .nav__item").forEach(b=>b.setAttribute("aria-current", String(b.dataset.go===state.view)));
  $("#libcount").textContent = readings.length;
  $("#ideanav").innerHTML = ideas.map(i=>{
    const st = stageOf(i.stage), rs = byIdea(i.id);
    const read = rs.filter(r=>r.status==="read").length;
    return `<button class="ideanav__item" data-idea="${i.id}" style="--stage:${st.c}"
      aria-current="${state.view==='idea' && state.idea===i.id}">
      <span class="ideanav__bar"></span>
      <span><span class="ideanav__t">${esc(i.title)}</span>
      <span class="ideanav__m">${st.label} · ${read}/${rs.length} read</span></span>
    </button>`;
  }).join("");
}

function renderTopbar(){
  const t = $("#topbar");
  if(state.view!=="idea"){
    const titles = {cockpit:["Cockpit","Everything on the bench"], library:["Library","Every source, across every idea"], notes:["Why it works this way","Design notes & alternatives"]};
    const [a,b] = titles[state.view];
    t.style.removeProperty("--stage");
    t.innerHTML = `<div class="crumb"><span class="crumb__t">${a}</span>
      <span class="lbl" style="margin-left:4px">${b}</span></div>`;
    return;
  }
  const idea = ideas.find(i=>i.id===state.idea), st = stageOf(idea.stage);
  const rs = byIdea(idea.id), cs = cardsOf(idea.id);
  t.style.setProperty("--stage", st.c);
  t.innerHTML = `
    <div class="crumb">
      <span class="crumb__t">${esc(idea.title)}</span>
      <span class="crumb__stage">${st.label}</span>
    </div>
    <div class="tabs">
      <button class="tab" data-tab="brief"   aria-current="${state.tab==='brief'}">Brief</button>
      <button class="tab" data-tab="reading" aria-current="${state.tab==='reading'}">Reading<span class="tab__n">${rs.length}</span></button>
      <button class="tab" data-tab="draft"   aria-current="${state.tab==='draft'}">Draft<span class="tab__n">${words(drafts[idea.id]||"")}w</span></button>
    </div>
    <div class="topbar__right">
      <span class="lbl">${cs.filter(c=>c.used).length}/${cs.length} cards used</span>
    </div>`;
}

/* ==================== cockpit ==================== */
function viewCockpit(){
  const totalCards = readings.reduce((n,r)=>n+r.cards.length,0);
  const readN = readings.filter(r=>r.status==="read").length;
  const draftW = Object.values(drafts).reduce((n,d)=>n+words(d),0);
  const counts = STAGES.map(s=>ideas.filter(i=>i.stage===s.id).length);

  return `
  <div class="hero">
    <div>
      <h1>Four ideas on the bench.</h1>
      <p>Two are warm. <b>The Cost of Legibility</b> has been in drafting for nine days and has five unspent cards — that is the one to sit down with.</p>
    </div>
    <div class="gauges">
      <div class="gauge"><span class="gauge__n">${ideas.length}</span><span class="gauge__l">Ideas</span></div>
      <div class="gauge"><span class="gauge__n">${readN}<span style="color:var(--faint)">/${readings.length}</span></span><span class="gauge__l">Read</span></div>
      <div class="gauge"><span class="gauge__n">${totalCards}</span><span class="gauge__l">Cards</span></div>
      <div class="gauge"><span class="gauge__n">${(draftW/1000).toFixed(1)}k</span><span class="gauge__l">Words</span></div>
    </div>
  </div>

  <div class="pipeline">
    ${STAGES.map((s,i)=>`<div class="pipeline__seg" style="--stage:${s.c}">
      <div class="pipeline__l">${s.label}</div><div class="pipeline__n">${counts[i]}</div></div>`).join("")}
  </div>

  <div class="ideas">
    ${ideas.map(i=>{
      const st = stageOf(i.stage), k = stageIdx(i.stage);
      const rs = byIdea(i.id), cs = cardsOf(i.id);
      const w = words(drafts[i.id]||"");
      return `<button class="idea" data-idea="${i.id}" style="--stage:${st.c}">
        <span class="idea__ramp">${STAGES.map((sg,j)=>`<i style="${j<=k?"background:"+sg.c:""}"></i>`).join("")}</span>
        <span class="idea__body">
          <span class="idea__top"><span class="idea__title">${esc(i.title)}</span></span>
          <span class="idea__blurb">${esc(i.blurb)}</span>
          <span class="idea__stats">
            <span class="stat"><span class="stat__n">${rs.filter(r=>r.status==="read").length}/${rs.length}</span><span class="stat__l">Read</span></span>
            <span class="stat"><span class="stat__n">${cs.length}</span><span class="stat__l">Cards</span></span>
            <span class="stat"><span class="stat__n">${cs.filter(c=>!c.used).length}</span><span class="stat__l">Unspent</span></span>
            <span class="stat"><span class="stat__n">${w?w.toLocaleString():"—"}</span><span class="stat__l">Words</span></span>
          </span>
        </span>

/* ==================== design notes ==================== */
function viewNotes(){
  return `<div class="doc">
    <span class="lbl">Design notes</span>
    <h1 style="margin-top:8px">Why it works this way</h1>
    <p class="doc__lede">Your sketch — ideas in a rail, a reading page of tiles, a writing page — is right, and this is built on it. I changed three things, and each change is arguable. Here is what and why, so you can overrule me.</p>

    <h2>1. The card is the load-bearing part</h2>
    <p>A reading list and a draft are the two visible halves of the job. The invisible half is the bit in between: the moment you remember that Scott said something about forestry, and go hunting for it. That hunt is where research projects die — not in the reading, and not in the writing.</p>
    <p>So the smallest unit here is not the paper. It is the <strong>card</strong>: one claim, quote, or objection, with its page reference attached. You make cards while reading, in the note page. They appear automatically in the <strong>evidence rail</strong> next to your draft, and clicking one drops it into the prose with the citation already formed.</p>
    <p>The payoff is a number you can see on every idea: <strong>unspent cards</strong>. Twelve unspent cards means you have done the reading and not yet done the writing. Zero unspent cards and a short draft means go read something. It is the single most useful signal in the whole tool, and it only exists because notes are broken into pieces rather than left as a wall of text.</p>
    <p>If this feels like overhead: it is optional. Write a summary and nothing else, and the tool degrades gracefully into exactly what you asked for.</p>
    <p>You suggested a dropdown on each tile for notes. I made it a full page instead, for one reason: a dropdown sets an expectation that what goes in it is short. The summary is the single highest-value thing you will write about a source — it is where you find out whether you actually understood it — and it deserves a page with room, not a drawer. The tile still tells you at a glance whether notes exist, which is the part a dropdown was really for.</p>

    <h2>2. Sources are shared, not owned</h2>
    <p>You described readings as living inside an idea. In practice a good source serves two or three ideas at once, and the moment you have to decide which folder a paper "belongs" to, you have added the exact friction you asked me to avoid.</p>
    <p>So: one <strong>library</strong>, and ideas are tags on it. Nothing about the interface changes — the reading page still shows only that idea's tiles. But adding an existing source to a second idea is one click, and your notes come with it.</p>

    <h2>3. Ideas have a temperature</h2>
    <p>An idea moves: spark → gathering → drafting → cutting → published. That is a real sequence, so the interface encodes it as one — the colour of an idea warms as it moves toward the camera, and the cockpit shows the whole pipeline at a glance. This is the "am I actually making progress" view, and it is the thing a plain folder tree can never give you.</p>

    <h2>Four ways this could have been organised</h2>
    <div class="opts">
      <div class="opt opt--pick">
        <div class="opt__h"><h3>Idea-first navigation, library-backed data</h3><span class="opt__tag">Built</span></div>
        <p>You navigate by idea, exactly as you sketched. Underneath, sources and cards live in one pool and are tagged. Best of both: simple mental model, no duplication, and cross-idea search comes free.</p>
      </div>
      <div class="opt">
        <div class="opt__h"><h3>Strict idea folders</h3></div>
        <p>Your original sketch, taken literally. Simplest possible model, and genuinely fine for the first six months. It breaks the first time a paper matters to two ideas, and it breaks quietly — you end up with two copies and notes in the wrong one.</p>
      </div>
      <div class="opt">
        <div class="opt__h"><h3>Note-first (zettelkasten)</h3></div>
        <p>Cards are primary, ideas are just clusters that emerge from links between them. Powerful for people who read very widely without knowing what they are making. Wrong here: you already know the output is an essay and then a video, and this model is famously good at generating notes and bad at generating finished work.</p>
      </div>
      <div class="opt">
        <div class="opt__h"><h3>Pure kanban board</h3></div>
        <p>Every idea a card, dragged across stage columns. Great overview, no depth — it tracks the project without holding any of the work. It survives here as the pipeline strip at the top of the cockpit, which is the useful 10% of it.</p>
      </div>
    </div>

    <h2>Adding a source must cost about four seconds</h2>
    <p>The capture bar takes anything you can copy and resolves it locally:</p>
    <ul>
      <li><strong>DOI or a journal link</strong> → Crossref returns title, authors, year, venue.</li>
      <li><strong>arXiv link or ID</strong> → the arXiv API, plus the abstract pre-filled as a starting summary.</li>
      <li><strong>ISBN or a book title</strong> → Open Library, including the real cover image when one exists.</li>
      <li><strong>A dropped PDF</strong> → the file is copied into your folder, the first page is scanned for a DOI, and the rest is filled in from that.</li>
      <li><strong>Anything else</strong> → the page title and byline, and you fix it in five seconds if it is wrong.</li>
    </ul>
    <p>All four of those APIs allow direct browser requests, so this needs no server and no keys. When a cover is unavailable — most papers — the tile draws its own, from a hue derived from the title, with the form telling you the kind: ruled lines for a paper, a spine for a book, a drop initial for an essay. A wall of identical grey rectangles would defeat the purpose of a tile view.</p>

    <h2>How to actually run it</h2>
    <p><strong>A single local HTML file, no server, no password.</strong> You open it from your own disk. On first run it asks for a folder — say <code>~/Projects/marginalia</code> — and from then on it reads and writes:</p>
    <ul>
      <li><code>data.json</code> — ideas, sources, cards, notes.</li>
      <li><code>essays/*.md</code> — one plain markdown file per draft, so your writing is never trapped in this tool.</li>
      <li><code>pdfs/</code> — the papers themselves.</li>
    </ul>
    <p>That folder is a git repo, which gives you version history of every draft for free, and a backup by pushing it to a private remote. There is nothing to host, nothing to log into, and no account that can be shut down. It is also genuinely private in the way a password-protected site is not.</p>
    <p>The one thing you lose is your phone. If reading on the sofa and capturing a source from your phone matters, the upgrade path is small: the same file served by a ~50-line local server, reachable from your phone over Tailscale. I would not build that until you have wanted it twice.</p>

    <h2>Deliberately not here</h2>
    <ul>
      <li><strong>Due dates and priorities.</strong> This is your own project. A tool that can nag you about a self-imposed deadline is a tool you will start avoiding.</li>
      <li><strong>Rich text everywhere.</strong> Notes are plain, drafts are markdown. Formatting is procrastination in a costume.</li>
      <li><strong>A separate "notes" section.</strong> Notes belong to the thing they are about. There is no orphan-note inbox to feel guilty about.</li>
      <li><strong>Collaboration, sharing, export-to-anything.</strong> Nobody else is coming.</li>
    </ul>

    <h2>What I would build first</h2>
    <p>The cockpit, the capture bar, the tile grid, and the note page — that is the useful core and about a day's work. The evidence rail is the part worth getting right and can come second, once you have twenty real cards to test it against. Everything else is decoration.</p>
    <p style="color:var(--faint); font-size:13px; margin-top:26px">Every screen in this prototype is live — add a source, insert a card into the draft, type in the essay. Nothing persists on reload, which is the honest signal that this is a mockup.</p>
  </div>`;
}

/* ==================== router ==================== */
function render(){
  renderRail(); renderTopbar();
  const v = $("#view");
  v.classList.toggle("view--wide", state.view==="idea" && state.tab==="draft");
  if(state.view==="cockpit") v.innerHTML = viewCockpit();
  else if(state.view==="library") v.innerHTML = viewLibrary();
  else if(state.view==="notes")   v.innerHTML = viewNotes();
  else if(state.reading)          v.innerHTML = viewNote();
  else if(state.tab==="brief")    v.innerHTML = viewBrief();
  else if(state.tab==="draft")    v.innerHTML = viewDraft();
  else                            v.innerHTML = viewReading();
  $$(".pad").forEach(p=>{
    const sync=()=>p.dataset.empty = String(p.textContent.trim()==="");
    sync(); p.addEventListener("input", sync);
  });
}

/* ==================== capture (fake resolver) ==================== */
const RESOLVER = [
  {m:/10\.1126|science/i, r:{kind:"paper", title:"Complex Systems: Network Thinking", authors:["Melanie Mitchell"], year:2006, venue:"Artificial Intelligence 170", h:268}},
  {m:/arxiv|2401\./i,     r:{kind:"paper", title:"On the Measure of Intelligence", authors:["François Chollet"], year:2019, venue:"arXiv:1911.01547", h:284}},
  {m:/isbn|9780/i,        r:{kind:"book",  title:"The Death and Life of Great American Cities", authors:["Jane Jacobs"], year:1961, venue:"Random House", h:14}}
];
const DEMO = "https://doi.org/10.1073/pnas.0610172104";

function resolve(input){
  const hit = RESOLVER.find(x=>x.m.test(input));
  if(hit) return {...hit.r};
  if(/pnas|0610172104/i.test(input))
    return {kind:"paper", title:"The Origins of Scaling in Cities", authors:["L. Bettencourt"], year:2013, venue:"Science 340", h:176};
  return {kind:"paper", title:input.replace(/^https?:\/\//,"").slice(0,54)||"Untitled source",
          authors:["Unknown author"], year:new Date().getFullYear(), venue:"Pasted link", h:Math.floor(Math.random()*360)};
}

function addSource(input){
  const tiles = $("#tiles"); if(!tiles) return;
  const ghost = document.createElement("div");
  ghost.className = "tile tile--ghost";
  ghost.innerHTML = `<div class="cover" style="--h:210"><span class="shimmer"></span>
      <span class="cover__kind">resolving…</span>
      <span class="cover__v" style="opacity:.45">${esc(input.slice(0,44))}</span></div>
    <span class="tile__a">Looking up metadata…</span>`;
  tiles.prepend(ghost);
  setTimeout(()=>{
    const meta = resolve(input);
    const r = {id:"n"+Date.now(), ...meta, ideas:[state.idea], status:"queued", summary:"", cards:[]};
    readings.unshift(r);
    state.filter = "all";
    render();
    const el = $(`[data-reading="${r.id}"] .cover`); if(el) el.classList.add("cover--new");
  }, 950);
}

/* ==================== events ==================== */
document.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]");
  if(go){ state.view = go.dataset.go; state.reading = null; return render(); }

  const idea = e.target.closest("[data-idea]");
  if(idea){ state.view="idea"; state.idea=idea.dataset.idea; state.tab="reading"; state.reading=null; state.filter="all"; return render(); }

  const tab = e.target.closest("[data-tab]");
  if(tab){ state.tab = tab.dataset.tab; state.reading = null; return render(); }

  const row = e.target.closest("tr[data-reading]");
  if(row){ state.view="idea"; state.idea=row.dataset.jump; state.tab="reading"; state.reading=row.dataset.reading; return render(); }

  const tile = e.target.closest("[data-reading]");
  if(tile && tile.tagName==="BUTTON"){ state.reading = tile.dataset.reading; return render(); }

  if(e.target.closest("[data-back]")){ state.reading = null; return render(); }

  const flt = e.target.closest("[data-filter]");
  if(flt){ state.filter = flt.dataset.filter; return render(); }

  if(e.target.closest("#trydemo")){ $("#capture").value = DEMO; addSource(DEMO); $("#capture").value=""; return; }

  const ec = e.target.closest("[data-card]");
  if(ec){ insertCard(+ec.dataset.card); return; }

  const st = e.target.closest(".statusrow .filter");
  if(st){ $$(".statusrow .filter", st.parentElement).forEach(b=>b.setAttribute("aria-pressed","false"));
          st.setAttribute("aria-pressed","true"); return; }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="capture" && e.target.value.trim()){
    addSource(e.target.value.trim()); e.target.value=""; e.preventDefault();
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="cardsearch"){
    state.q = e.target.value;
    const list = $(".rail2__list"); if(!list) return;
    const all = cardsOf(state.idea);
    const cs = all
      .filter(c=>(c.q+c.src.title).toLowerCase().includes(state.q.toLowerCase()))
      .sort((a,b)=>Number(a.used)-Number(b.used));
    list.innerHTML = ecards(cs, all);
  }
});

/* the caret is where the quote belongs, not the end of the document */
let lastRange = null;
document.addEventListener("selectionchange", ()=>{
  const sel = document.getSelection();
  if(!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0), prose = $("#prose");
  if(prose && prose.contains(r.commonAncestorContainer)) lastRange = r.cloneRange();
});

function insertCard(n){
  const i = ideas.find(x=>x.id===state.idea);
  const c = cardsOf(i.id)[n]; if(!c) return;
  const prose = $("#prose"); if(!prose) return;
  const bq = document.createElement("blockquote");
  bq.className = "justin";
  bq.innerHTML = `${esc(c.q)}<cite>${esc(c.src.authors[0])}, <i>${esc(c.src.title)}</i> (${c.src.year}), ${esc(c.loc)}</cite>`;
  let block = null;
  if(lastRange && prose.contains(lastRange.commonAncestorContainer)){
    block = lastRange.commonAncestorContainer;
    if(block.nodeType===3) block = block.parentNode;
    while(block && block.parentNode !== prose) block = block.parentNode;
  }
  if(block) prose.insertBefore(bq, block.nextSibling); else prose.appendChild(bq);
  const real = c.src.cards.find(x=>x.q===c.q); if(real) real.used = true;
  bq.scrollIntoView({behavior:"smooth", block:"center"});
  const meter = $(".rail2__meter"); const all = cardsOf(i.id);
  if(meter) meter.textContent = `${all.filter(x=>x.used).length}/${all.length} spent`;
  const btn = $(`[data-card="${n}"]`);
  if(btn){ btn.classList.add("ecard--used"); const s = btn.querySelector(".ecard__s span:last-child");
           if(s){ s.textContent="✓ used"; s.className="ecard__used"; } }
}

/* ==================== theme ==================== */
const MODES = ["Auto","Light","Dark"]; let mode = 0;
$("#themebtn").addEventListener("click", ()=>{
  mode = (mode+1)%3;
  $("#thememode").textContent = MODES[mode];
  if(mode===0) document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", MODES[mode].toLowerCase());
});

render();
</script>
